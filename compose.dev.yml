# Development only. The tests start their own containers, see internal/integration/testenv.
services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nokku
      PGDATA: /inmemory-db
    volumes:
      - type: tmpfs
        target: /inmemory-db
    ports:
      - 5432:5432
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    restart: unless-stopped

  vault:
    image: docker.io/hashicorp/vault:2.1.2
    container_name: vault
    # TLS with a self-signed cert, nokku only talks https to Vault. Clients set VAULT_SKIP_VERIFY=true.
    command: ["server", "-dev", "-dev-tls"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_ADDR: "https://0.0.0.0:8200"
      VAULT_API_ADDR: "https://0.0.0.0:8200"
      VAULT_SKIP_VERIFY: "true"
    cap_add:
      - IPC_LOCK
    ports:
      - 8200:8200
    restart: unless-stopped
