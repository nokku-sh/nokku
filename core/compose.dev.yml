# Development only. The tests start their own containers, see internal/integration/testenv.
services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements,auto_explain"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nokku
      PGDATA: /inmemory-db
    volumes:
      - type: tmpfs
        target: /inmemory-db
    # Over TCP, so the server that runs the init scripts does not count.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      retries: 30
    ports:
      - 5432:5432
    restart: unless-stopped

  # OIDC and SCIM for nokku. task seed:idp fills it, see cmd/seed/idp.go.
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.18.0
    container_name: pocket-id
    environment:
      APP_URL: http://localhost:1411
      ENCRYPTION_KEY: dev-only-not-secret-at-all-0123456789
      STATIC_API_KEY: dev-static-api-key
      ANALYTICS_DISABLED: "true"
      # Settings come from here, not from the admin UI.
      UI_CONFIG_DISABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: pocket-id@nokku.test
      # There are no passwords. Ask for a code on the login page, it lands in Mailpit.
      EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED: "true"
    volumes:
      - type: tmpfs
        target: /app/data
    ports:
      - "1411:1411"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  vault:
    image: docker.io/hashicorp/vault:2.2.1
    container_name: vault
    # TLS from a CA made at every start, nokku only talks https to Vault. task containers copies the CA to
    # data/vault/vault-ca.pem, where VAULT_CACERT points.
    command: ["server", "-dev", "-dev-tls", "-dev-tls-cert-dir=/tmp"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_API_ADDR: "https://0.0.0.0:8200"
      VAULT_CACERT: "/tmp/vault-ca.pem"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 1s
      retries: 30
    cap_add:
      - IPC_LOCK
    ports:
      - 8200:8200
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:v1.32.0
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
