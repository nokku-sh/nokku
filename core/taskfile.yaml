version: "3"

tasks:
  dev:
    desc: Run backend and frontend concurrently and seed the users to sign in as, the app is on the backend's port
    deps: [backend, frontend, seed:idp]

  dev:reset:
    desc: Wipe every dev container, then run dev
    cmds:
      - docker compose -f compose.dev.yml up -d --force-recreate
      - task: dev

  containers:
    desc: Start the dev containers of compose.dev.yml, wait for Postgres and Vault, copy out Vault's CA and create its transit key
    cmds:
      - docker compose -f compose.dev.yml up -d
      - docker compose -f compose.dev.yml up -d --wait postgres vault
      - mkdir -p data/vault
      - docker compose -f compose.dev.yml cp vault:/tmp/vault-ca.pem data/vault/vault-ca.pem
      - docker compose -f compose.dev.yml exec -T -e VAULT_TOKEN=root vault sh -c 'vault read sys/mounts/transit >/dev/null 2>&1 || vault secrets enable transit'
      - docker compose -f compose.dev.yml exec -T -e VAULT_TOKEN=root vault vault write -f transit/keys/nokku >/dev/null

  backend:
    desc: Run backend
    deps: [containers]
    env:
      NOKKU_DEV_UI: "http://localhost:5173"
    cmds:
      - go run {{ if .NOKKU_LICENSE_PUBLIC_KEY }}-ldflags="-X github.com/nokku-sh/nokku/core/internal/config.licensePublicKey={{ .NOKKU_LICENSE_PUBLIC_KEY }}"{{ end }} ./cmd/nokku

  frontend:
    desc: Run frontend
    dir: web
    cmds:
      - pnpm run dev

  build:
    desc: Build binary
    cmds:
      - go generate ./...
      - go build -ldflags="-s -w{{ if .NOKKU_LICENSE_PUBLIC_KEY }} -X github.com/nokku-sh/nokku/core/internal/config.licensePublicKey={{ .NOKKU_LICENSE_PUBLIC_KEY }}{{ end }}" -trimpath -o bin/nokku ./cmd/nokku

  test:integration:
    desc: Run the integration tests, they start Postgres, Keycloak and Vault in Docker
    cmds:
      - go test -tags integration -race -count=1 -cover -coverpkg=./internal/... ./internal/integration/...

  test:hosted:
    desc: Run the API tests the way the hosted service runs, with NOKKU_SAAS, a KMS and workspace hosts, needs Docker
    env:
      NOKKU_TEST_HOSTED: "1"
    cmds:
      - go test -tags integration -race -count=1 -timeout 15m ./internal/integration/api/...

  load:
    desc: Measure what one access change costs with fake daemons connected, the count goes after --, needs Docker
    env:
      NOKKU_LOAD_DAEMONS: '{{.CLI_ARGS | default "1000"}}'
    cmds:
      - go test -tags integration -count=1 -v -timeout 30m -run TestLoadFanOut ./internal/integration/api/

  lint:
    desc: Run go vet & lint
    ignore_error: true
    cmds:
      - go mod tidy
      - go fmt ./...
      # The tag keeps internal/integration compiling, its tests run in test:integration
      - go vet -tags integration ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix
      - cd web; pnpm fmt; pnpm lint

  snapshot:
    desc: Build a snapshot of the core image, then scan it
    env:
      NOKKU_ONLY: core
      IMAGE: ghcr.io/nokku-sh/nokku
    dir: ..
    cmds:
      - go generate ./core/web
      - goreleaser release --snapshot --clean --skip=validate,sign,sbom,archive,nfpm,docker
      - docker tag goreleaser.ko.local:latest $IMAGE:nightly
      - grype $IMAGE:nightly

  snapshot:bin:
    desc: Build snapshot binaries of the core only
    env:
      NOKKU_ONLY: core
    dir: ..
    cmds:
      - go generate ./core/web
      - goreleaser build --snapshot --clean {{.CLI_ARGS}}

  seed:
    desc: Fill the dev database with fake data, flags go after --
    cmds:
      - go run ./cmd/seed {{.CLI_ARGS}}

  seed:idp:
    desc: Set up Pocket ID sign-ins with ready users, it waits for the server
    cmds:
      # It runs next to the server in dev, a failure must not stop that.
      - cmd: go run ./cmd/seed idp
        ignore_error: true
