# Production deployment for Nokku.
#
#   cp .env.prod.example .env   # fill in your values
#   docker compose -f compose.prod.yml up -d
#
# Services:
#   nokku     - the core (NOKKU_IMAGE, defaults to ghcr.io/nokku-sh/nokku)
#   postgres  - persistent database
#   caddy     - TLS-terminating reverse proxy
name: nokku

networks:
  nokku:

volumes:
  pgdata:
  nokku-data:
  caddy-data:
  caddy-config:

services:
  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nokku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nokku}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - nokku

  nokku:
    image: ${NOKKU_IMAGE:-ghcr.io/nokku-sh/nokku:latest}
    depends_on:
      postgres:
        condition: service_healthy
    # All NOKKU_*, OAuth, email and storage settings come from .env.
    env_file: .env
    # The schema is migrated on every start.
    environment:
      # Point the app at the services in this stack.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-nokku}
      PGUSER: ${POSTGRES_USER:-nokku}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      PGSSLMODE: disable
      # Local object storage (default backend), persisted on a volume.
      NOKKU_STORAGE_URL: file:///home/nonroot/recordings
    volumes:
      # The image runs as nonroot. A volume on its home takes that owner, one on /data would stay root's.
      - nokku-data:/home/nonroot
    # Only Caddy reaches it, so only Caddy can name the client. Don't publish the port.
    # The app listens on 0.0.0.0:3000 by default (NOKKU_PORT in .env to change).
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - nokku

  caddy:
    image: docker.io/library/caddy:2-alpine
    depends_on:
      - nokku
    environment:
      SITE_ADDRESS: ${NOKKU_BASE_URL:?NOKKU_BASE_URL is required in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - nokku
