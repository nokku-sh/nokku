{{- if .Values.networkPolicy.enabled -}}
{{- if not (or .Values.networkPolicy.namespaces .Values.networkPolicy.extraFrom) -}}
{{- fail "networkPolicy.namespaces must name the namespace of your ingress controller or gateway, or nothing reaches Nokku" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nokku.fullname" . }}
  labels:
    {{- include "nokku.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nokku.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- with .Values.networkPolicy.namespaces }}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml . | nindent 18 }}
        {{- end }}
        # helm test checks the health endpoint from inside the release.
        - podSelector:
            matchLabels:
              {{- include "nokku.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
