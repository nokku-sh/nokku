{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.password) (not .Values.postgresql.auth.existingSecret) -}}
{{- fail "postgresql.auth.password must be set for the bundled PostgreSQL (openssl rand -hex 16), or use postgresql.auth.existingSecret" -}}
{{- end -}}
{{- if not .Values.secrets.existingSecret }}
{{- $dbPassword := .Values.secrets.databasePassword -}}
{{- if and (eq $dbPassword "") .Values.postgresql.enabled -}}
{{- $dbPassword = .Values.postgresql.auth.password -}}
{{- end -}}
{{- if eq $dbPassword "" -}}
{{- fail "secrets.databasePassword is required when postgresql.enabled=false or postgresql.auth.existingSecret is used, and secrets.existingSecret is not set" -}}
{{- end -}}
{{- if and (not .Values.app.kmsURI) (lt (len .Values.secrets.secret) 32) -}}
{{- fail "secrets.secret must be set to at least 32 characters (openssl rand -hex 32), or set app.kmsURI, or use secrets.existingSecret" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nokku.secretName" . }}
  labels:
    {{- include "nokku.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.secret }}
  NOKKU_SECRET: {{ . | quote }}
  {{- end }}
  DATABASE_PASSWORD: {{ $dbPassword | quote }}
{{- end }}
