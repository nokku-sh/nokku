apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nokku.fullname" . }}
  labels:
    {{- include "nokku.labels" . | nindent 4 }}
spec:
  # Nokku runs as one instance. Streams, relays and web sessions live in its memory, two pods would split them.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nokku.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nokku.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nokku.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.persistence.enabled }}
          workingDir: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          env:
            - name: NOKKU_BASE_URL
              value: {{ .Values.app.baseUrl | quote }}
            - name: NOKKU_PORT
              value: {{ .Values.container.port | quote }}
            - name: NOKKU_DEBUG
              value: {{ .Values.app.debug | quote }}
            {{- with .Values.app.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: PGHOST
              value: {{ include "nokku.databaseHost" . | quote }}
            - name: PGPORT
              value: {{ .Values.app.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.app.database.name | quote }}
            - name: PGUSER
              value: {{ .Values.app.database.user | quote }}
            - name: PGSSLMODE
              value: {{ .Values.app.database.sslMode | quote }}
            - name: NOKKU_DB_AUTOMIGRATE
              value: {{ .Values.app.database.autoMigrate | quote }}
            - name: NOKKU_LOCAL_STORAGE_PATH
              value: {{ .Values.app.localStoragePath | quote }}
            - name: NOKKU_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nokku.secretName" . }}
                  key: NOKKU_SECRET
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nokku.secretName" . }}
                  key: DATABASE_PASSWORD
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.app.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or .Values.persistence.enabled .Values.volumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nokku.fullname" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
