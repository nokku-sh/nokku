apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nokku.fullname" . }}-test-connection"
  labels:
    {{- include "nokku.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # Plain HTTP from inside the cluster is only answered on the health check.
      args: ['{{ include "nokku.fullname" . }}:{{ .Values.service.port }}/healthz']
  restartPolicy: Never
