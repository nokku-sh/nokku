image:
  repository: ghcr.io/nokku-sh/nokku
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as 65532, fsGroup lets it write the volume.
podSecurityContext:
  fsGroup: 65532
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80
  # Traefik needs traefik.ingress.kubernetes.io/service.serversscheme: h2c here, see the README.
  annotations: {}

container:
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nokku.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - nokku.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# Lets only your ingress controller or gateway reach Nokku. Anything else in the cluster that reaches it could name
# any client address, see "Client addresses" in the README. Needs a network plugin that enforces policies.
# A wrong namespace cuts Nokku off: the ingress answers 502 or 504 for every request. Anything else in the cluster
# that calls Nokku directly, like a scraper or a nokkud pointed at the service, needs an entry in extraFrom.
networkPolicy:
  enabled: false
  # Where your ingress controller or gateway proxy runs, like kube-system for Traefik on k3s.
  namespaces: []
  # More NetworkPolicy peers that may reach Nokku, like a podSelector, or an ipBlock with the node addresses for a
  # controller on the host network.
  extraFrom: []

resources: {}

# Holds liveness back until the core has started, a long migration killed halfway only starts over.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 1
  failureThreshold: 300

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10

# With one instance this wait is downtime. The tolerance keeps a short stall from taking the only pod out.
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 1
  failureThreshold: 5

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  mountPath: /var/lib/nokku

app:
  # The public host name people and daemons reach, like nokku.example.com.
  # No scheme, it is always https. An IP address is refused.
  baseUrl: localhost
  debug: false
  # Sets OTEL_EXPORTER_OTLP_ENDPOINT. Other OTEL_* settings go in extraEnv.
  otlpEndpoint: ""
  database:
    host: ""
    port: "5432"
    name: nokku
    user: postgres
    sslMode: disable
  # Where recordings go. A relative folder lands on the persistent volume, s3://bucket?region=... is a bucket.
  storageURL: file://./data
  # Sets NOKKU_TRUSTED_PROXIES. Empty trusts a proxy on a private network to name the client, like the ingress or
  # gateway pods. Set IPs or CIDRs to trust only those, or to add a CDN or load balancer in front.
  trustedProxies: ""
  # Sets KMS_URI, then secrets.secret stays empty. Credentials like VAULT_TOKEN go in extraEnvFrom.
  kmsURI: ""
  extraEnv: []
  extraEnvFrom: []

secrets:
  # Set existingSecret to re-use an already managed secret.
  existingSecret: ""
  # Master secret for at-rest encryption, at least 32 characters. Leave it empty
  # with app.kmsURI. There is no default, a shared one would let anyone with a
  # database dump read the CA keys. Generate with: openssl rand -hex 32
  secret: ""
  # Used only when bundled PostgreSQL is disabled or custom credentials are needed.
  databasePassword: ""

postgresql:
  enabled: true
  auth:
    username: postgres
    # No default. Generate with: openssl rand -hex 16
    password: ""
    database: nokku
  primary:
    persistence:
      enabled: true
      size: 8Gi
