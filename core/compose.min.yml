# Minimal deployment for Nokku: the core, Postgres and Caddy, no domain needed.
#
#   cp .env.prod.example .env   # fill in your values
#   docker compose -f compose.min.yml up -d
#
# For a try on this machine set NOKKU_BASE_URL=localhost:3000 and open
# http://localhost:3000. For other machines give the host a name, like
# NOKKU_BASE_URL=nokku.lan. Caddy then serves it on port 443 with a
# certificate from its own CA. See "Without a domain" in the README.
# compose.prod.yml gets a real certificate instead.
name: nokku

networks:
  nokku:

volumes:
  pgdata:
  nokku-data:
  caddy-data:
  caddy-config:

services:
  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nokku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nokku}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - nokku

  nokku:
    image: ${NOKKU_IMAGE:-ghcr.io/nokku-sh/nokku:latest}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    # The schema is migrated on every start.
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-nokku}
      PGUSER: ${POSTGRES_USER:-nokku}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      PGSSLMODE: disable
      NOKKU_STORAGE_URL: file:///home/nonroot/recordings
    volumes:
      # The image runs as nonroot. A volume on its home takes that owner, one on /data would stay root's.
      - nokku-data:/home/nonroot
    # For NOKKU_BASE_URL=localhost:3000, a browser on this machine only. A
    # program on this machine can name any client address through it.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - nokku

  caddy:
    image: docker.io/library/caddy:2-alpine
    depends_on:
      - nokku
    environment:
      SITE_ADDRESS: ${NOKKU_BASE_URL:?NOKKU_BASE_URL is required in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.min:/etc/caddy/Caddyfile:ro
      # Holds the CA. Keep it, or every client needs the new root.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - nokku
