# Minimal deployment for Nokku: just the backend and Postgres.
#
#   cp .env.prod.example .env   # fill in your values
#   docker compose -f compose.min.yml up -d
#
# No reverse proxy. The app is published on host port 3000. For a try on this
# machine set NOKKU_BASE_URL=localhost:3000. For other machines give the host
# a name, the core then serves https with a CA of its own:
#   NOKKU_BASE_URL=nokku.lan:3000
# See "Without a proxy" in the README. compose.prod.yml runs Caddy instead.
name: nokku

volumes:
  pgdata:
  nokku-data:

services:
  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nokku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nokku}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nokku:
    image: ${NOKKU_IMAGE:-ghcr.io/nokku-sh/nokku:latest}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    # Schema migrations run automatically on boot (NOKKU_DB_AUTOMIGRATE=true).
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-nokku}
      PGUSER: ${POSTGRES_USER:-nokku}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      PGSSLMODE: disable
      NOKKU_STORAGE: local
      NOKKU_LOCAL_STORAGE_PATH: /data
    volumes:
      - nokku-data:/data
    ports:
      - "3000:3000"
    restart: unless-stopped
