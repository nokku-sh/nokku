version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        initialisms: ["id", "url", "api"]
        json_tags_case_style: "camel"
        emit_json_tags: true # Adds JSON tags to generated structs
        emit_prepared_queries: true
        emit_pointers_for_null_types: true # Pointers for null types
        emit_result_struct_pointers: true # More efficient for large result sets
        emit_params_struct_pointers: true # More efficient parameter passing
        rename:
          ssh_ca: "SSHCA"
          ssh_ca_key: "SSHCAKey"
        overrides:
          # UUID overrides
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          # Date/Time overrides
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          # Interval overrides
          - db_type: "pg_catalog.interval"
            go_type: "time.Duration"
          - db_type: "pg_catalog.interval"
            nullable: true
            go_type:
              type: "time.Duration"
              pointer: true

          # Enum overrides
          - column: "users.role"
            go_type:
              import: "github.com/nokku-sh/nokku/gen/nokku/v1"
              type: "WorkspaceRole"
          - column: "service_accounts.role"
            go_type:
              import: "github.com/nokku-sh/nokku/gen/nokku/v1"
              type: "WorkspaceRole"
          - column: "invites.role"
            go_type:
              import: "github.com/nokku-sh/nokku/gen/nokku/v1"
              type: "WorkspaceRole"
          - column: "access_requests.status"
            go_type:
              import: "github.com/nokku-sh/nokku/gen/nokku/v1"
              type: "AccessRequestStatus"
          - column: "access_request_details.status"
            go_type:
              import: "github.com/nokku-sh/nokku/gen/nokku/v1"
              type: "AccessRequestStatus"
          - column: "audit_streams.kind"
            go_type:
              import: "github.com/nokku-sh/nokku/gen/nokku/v1"
              type: "AuditStreamKind"

          # JSON overrides
          - column: "service_account_federations.claims"
            go_type:
              type: "map[string]string"
          - column: "daemons.config"
            go_type:
              import: "github.com/nokku-sh/nokku/gen/nokku/v1"
              type: "DaemonConfig"
              pointer: true
          - column: "workspaces.settings"
            go_type:
              import: "github.com/nokku-sh/nokku/gen/nokku/v1"
              type: "WorkspaceSettings"
              pointer: true

          # A token is stored as its hash, one way
          - db_type: "hashed_token"
            go_type:
              import: "github.com/nokku-sh/nokku/core/internal/crypto"
              type: "HashedToken"
          - db_type: "hashed_token"
            nullable: true
            go_type:
              import: "github.com/nokku-sh/nokku/core/internal/crypto"
              type: "HashedToken"
              pointer: true

          # Plain bytes, only Keyset.Open reads the secret. db/reencrypt.go lists the same columns.
          - db_type: "sealed"
            go_type:
              import: "github.com/nokku-sh/nokku/core/internal/crypto"
              type: "Sealed"
          - db_type: "sealed"
            nullable: true
            go_type:
              import: "github.com/nokku-sh/nokku/core/internal/crypto"
              type: "Sealed"
