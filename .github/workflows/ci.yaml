name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: nokku-sh/.github/.github/workflows/go-ci.yaml@main

  proto:
    name: Proto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Only builds two small generators, not worth a cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Format and lint
        working-directory: proto
        run: |
          buf format -d --exit-code
          buf lint

      - name: Generated API code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          npm install -g @bufbuild/protoc-gen-es@2
          buf generate
          # The generators stamp their own version in each file, only the code has to match.
          git diff --exit-code \
            -I '^// @generated by protoc-gen-es v' \
            -I '^//[[:space:]]+protoc(-gen-go)?[[:space:]]' \
            -- gen core/web/src/lib/gen

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: "1.31.1"

      - name: Generated SQL code is up to date
        working-directory: core
        run: sqlc diff

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: latest

      - run: pnpm install --frozen-lockfile

      - name: Types, lint and format
        run: |
          pnpm check
          pnpm lint
          pnpm fmt:check

  # The one test that walks a revoke from the grant to the closed session.
  smoke:
    name: Smoke
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: nokku-sh/.github/actions/go-cache@main

      - name: Real binaries against throwaway containers
        working-directory: core
        run: go test -tags integration,smoke -count=1 -timeout 20m ./internal/integration/smoke/...

  # The API tests again the way the hosted service runs: NOKKU_SAAS, a KMS and workspace hosts.
  hosted:
    name: Hosted mode
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: nokku-sh/.github/actions/go-cache@main

      - name: API tests in hosted mode
        working-directory: core
        env:
          NOKKU_TEST_HOSTED: "1"
        run: go test -tags integration -race -count=1 -timeout 15m ./internal/integration/api/...

  # nk cross-compiles from Linux, this is the one run on a real Mac.
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: nokku-sh/.github/actions/go-cache@main

      - uses: ./.github/actions/prepare

      - name: Test
        run: go test -race -count=1 ./cli/...

      - name: Doctor
        run: go run ./cli/cmd/nk doctor || true

  # Runs on main only, a pull request must never overwrite the nightly image.
  nightly:
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: nokku-sh/.github/.github/workflows/go-nightly.yaml@main
    secrets:
      NOKKU_LICENSE_PUBLIC_KEY: ${{ secrets.NOKKU_LICENSE_PUBLIC_KEY }}
