name: Release Tagger

on:
  schedule:
    - cron: "40 3 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@git-cliff

      - name: Check version bump
        id: version
        run: |
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          NEXT_TAG=$(git-cliff --bumped-version)

          if [ "$CURRENT_TAG" = "$NEXT_TAG" ]; then
            echo "No conventional commits warranting a release. Skipping."
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bumping $CURRENT_TAG to $NEXT_TAG"
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEXT_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.version.outputs.bump == 'true'
        run: git-cliff --tag "v${{ steps.version.outputs.version }}" --config cliff.toml -o CHANGELOG.md

      - name: Commit changelog and tag
        if: steps.version.outputs.bump == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"

      - name: Push
        if: steps.version.outputs.bump == 'true'
        run: |
          git push origin main
          git push origin "v${{ steps.version.outputs.version }}"

  release:
    needs: tag
    if: needs.tag.outputs.bump == 'true'
    uses: ./.github/workflows/release.yaml
    with:
      tag: v${{ needs.tag.outputs.version }}
    secrets: inherit
