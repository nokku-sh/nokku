name: Release

on:
  # schedule:
  #   - cron: "40 3 * * 5"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Build frontend
        working-directory: web/ui
        run: pnpm install && pnpm build

      - name: Build email templates
        working-directory: web/email
        run: pnpm install && pnpm export

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action@v0
        with:
          upload-release-assets: false

      - uses: ko-build/setup-ko@v0.10

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m

      - uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false

      - uses: taiki-e/install-action@git-cliff

      - name: Get next version
        id: version
        run: echo "version=$(git-cliff --bumped-version)" >> "$GITHUB_OUTPUT"

      - name: Check for unreleased changes
        id: check
        if: github.event_name != 'push'
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          if [ "${{ steps.version.outputs.version }}" = "$CURRENT" ]; then
            echo "No unreleased changes since v$CURRENT, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog (tagged)
        if: github.event_name == 'push'
        run: git-cliff --latest --strip header --config cliff.toml -o CHANGELOG.md

      - name: Generate changelog (unreleased)
        if: github.event_name != 'push' && steps.check.outputs.skip != 'true'
        run: git-cliff --bump --unreleased --strip header --config cliff.toml -o CHANGELOG.md

      - name: Create local tag
        if: github.event_name != 'push' && steps.check.outputs.skip != 'true'
        run: |
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git tag "v${{ steps.version.outputs.version }}"

      - uses: goreleaser/goreleaser-action@v7
        if: github.event_name == 'push' || steps.check.outputs.skip != 'true'
        with:
          version: latest
          args: release --clean --release-notes=CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"

      - name: Cleanup tag on failure
        if: github.event_name != 'push' && steps.check.outputs.skip != 'true' && failure()
        run: git tag -d "v${{ steps.version.outputs.version }}" 2>/dev/null || true
