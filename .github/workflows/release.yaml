name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    uses: nokku-sh/.github/.github/workflows/go-release.yaml@main
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      BUILD_ENV: NOKKU_LICENSE_PUBLIC_KEY=${{ secrets.NOKKU_LICENSE_PUBLIC_KEY }}
