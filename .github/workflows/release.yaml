name: Release

on:
  push:
    tags: [v*]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "Version tag to release, e.g. v1.2.3"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Build frontend
        working-directory: web/ui
        run: pnpm install && pnpm build

      - name: Build email templates
        working-directory: web/email
        run: pnpm install && pnpm export

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action@v0
        with:
          upload-release-assets: false

      - uses: ko-build/setup-ko@v0.10

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m

      - uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false

      - uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header --config cliff.toml -o "$RUNNER_TEMP/CHANGELOG.md"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"
