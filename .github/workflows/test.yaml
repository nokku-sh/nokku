name: Test

on:
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.svelte"
      - "**/*.go"
      - "**/*.sql"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.svelte"
      - "**/*.go"
      - "**/*.sql"
      - ".github/workflows/test.yaml"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Without it every database test skips, testdb fails the run instead.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Build frontend
        working-directory: web/ui
        run: pnpm install && pnpm build

      - name: Build email templates
        working-directory: web/email
        run: pnpm install && pnpm export

      - name: Lint and test
        run: |
          go mod tidy
          go mod verify
          go fmt ./...
          go vet ./...
          go test -race -count=1 ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m

      - name: Build
        run: go build -ldflags="-s -w" -o bin/nokku ./cmd/nokku

      # A pull request must never overwrite the nightly image.
      - uses: ko-build/setup-ko@v0.10
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

      - name: Publish Nightly Container
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: ko build ./cmd/nokku --bare --tags=nightly

      - name: Clean up old nightly releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-tags: "nightly"
          keep-n-tagged: 2
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
