name: Prepare
description: Runs before the shared CI, nightly and release steps.

runs:
  using: composite
  steps:
    # The database, SSO and KMS tests need them. They skip locally and fail in
    # CI when nothing answers. Only the shared CI job sets RUN_TESTS.
    - name: Start Postgres, Keycloak and Vault
      if: env.RUN_TESTS == 'true'
      shell: bash
      run: docker compose -f compose.test.yml up -d postgres keycloak vault

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: lts/*

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: latest

    - name: Build frontend
      shell: bash
      working-directory: web/ui
      run: pnpm install && pnpm build

    - name: Build email templates
      shell: bash
      working-directory: web/email
      run: pnpm install && pnpm export

    - name: Wait for Postgres, Keycloak and Vault
      if: env.RUN_TESTS == 'true'
      shell: bash
      run: |
        timeout 60 sh -c 'until docker exec postgres pg_isready -U postgres >/dev/null; do sleep 1; done'
        timeout 180 sh -c 'until curl -sf http://localhost:8080/realms/master >/dev/null; do sleep 2; done'
        timeout 60 sh -c 'until curl -skf https://localhost:8200/v1/sys/health >/dev/null; do sleep 1; done'
