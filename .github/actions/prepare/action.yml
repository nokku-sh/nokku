name: Prepare
description: Runs before the shared CI, nightly and release steps.

runs:
  using: composite
  steps:
    # Only the shared CI job sets RUN_TESTS. With the tag its lint and test
    # steps cover internal/integration too. Those tests start Postgres,
    # Keycloak and Vault themselves, the runner only needs Docker.
    - name: Include the integration tests
      if: env.RUN_TESTS == 'true'
      shell: bash
      run: echo "GOFLAGS=-tags=integration" >> "$GITHUB_ENV"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: lts/*

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: latest

    - name: Build frontend
      shell: bash
      working-directory: web/ui
      run: pnpm install && pnpm build

    - name: Build email templates
      shell: bash
      working-directory: web/email
      run: pnpm install && pnpm export
