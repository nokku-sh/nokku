{{- if not .Values.secrets.existingSecret }}
{{- $dbPassword := .Values.secrets.databasePassword -}}
{{- if and (eq $dbPassword "") .Values.postgresql.enabled -}}
{{- $dbPassword = .Values.postgresql.auth.password -}}
{{- end -}}
{{- if eq $dbPassword "" -}}
{{- fail "secrets.databasePassword is required when postgresql.enabled=false and secrets.existingSecret is not set" -}}
{{- end -}}
{{- if lt (len .Values.secrets.secret) 32 -}}
{{- fail "secrets.secret must be set to at least 32 characters (openssl rand -hex 32), or use secrets.existingSecret" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nokku.secretName" . }}
  labels:
    {{- include "nokku.labels" . | nindent 4 }}
type: Opaque
stringData:
  NOKKU_SECRET: {{ .Values.secrets.secret | quote }}
  DATABASE_PASSWORD: {{ $dbPassword | quote }}
{{- end }}
