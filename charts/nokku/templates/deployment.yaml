apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nokku.fullname" . }}
  labels:
    {{- include "nokku.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nokku.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nokku.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nokku.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.persistence.enabled }}
          workingDir: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          env:
            - name: BASE_URL
              value: {{ .Values.app.baseUrl | quote }}
            - name: PORT
              value: {{ .Values.container.port | quote }}
            - name: NOKKU_DEBUG
              value: {{ .Values.app.debug | quote }}
            - name: OTLP_ENDPOINT
              value: {{ .Values.app.otlpEndpoint | quote }}
            - name: OTLP_API_KEY
              value: {{ .Values.app.otlpApiKey | quote }}
            - name: OTLP_TRUST_REMOTE
              value: {{ .Values.app.otlpTrustRemote | quote }}
            - name: DATABASE_HOST
              value: {{ include "nokku.databaseHost" . | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.app.database.port | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.app.database.name | quote }}
            - name: DATABASE_USER
              value: {{ .Values.app.database.user | quote }}
            - name: DATABASE_SSL_MODE
              value: {{ .Values.app.database.sslMode | quote }}
            - name: DATABASE_AUTOMIGRATE
              value: {{ .Values.app.database.autoMigrate | quote }}
            - name: LOCAL_STORAGE_PATH
              value: {{ .Values.app.localStoragePath | quote }}
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nokku.secretName" . }}
                  key: SECRET
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nokku.secretName" . }}
                  key: DATABASE_PASSWORD
            - name: SESSION_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ include "nokku.secretName" . }}
                  key: SESSION_SEED
                  optional: true
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.app.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or .Values.persistence.enabled .Values.volumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nokku.fullname" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
