version: "3"

tasks:
  build:
    desc: Build binary
    cmds:
      - mkdir -p ~/.local/bin
      - CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o ~/.local/bin/ ./cmd/nk

  enclave:
    desc: Build nk with the Secure Enclave bridge (macOS only)
    platforms: [darwin]
    cmds:
      - ./internal/enclave/build.sh
      - mkdir -p ~/.local/bin
      - CGO_ENABLED=1 go build -tags enclave -ldflags="-s -w" -trimpath -o ~/.local/bin/ ./cmd/nk

  snapshot:bin:
    desc: Build snapshot binaries of nk only, the darwin ones only build on a Mac
    env:
      NOKKU_ONLY: cli
    # .goreleaser.yaml is in the repo root.
    dir: ..
    cmds:
      - goreleaser build --snapshot --clean {{.CLI_ARGS}}

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  fuzz:
    desc: Fuzz every fuzz target for FUZZTIME (default 30s)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - |
        for pkg in $(go list ./...); do
          for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz'); do
            go test "$pkg" -run='^$' -fuzz="^${target}$" -fuzztime="{{.FUZZTIME}}"
          done
        done
