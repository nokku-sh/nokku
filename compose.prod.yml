# Production deployment for Nokku.
#
#   cp .env.prod.example .env   # fill in your values
#   docker compose -f compose.prod.yml up -d
#
# Services:
#   nokku     - the backend (your image, defaults to ghcr.io/nokku-sh/nokku)
#   postgres  - persistent database
#   caddy     - TLS-terminating reverse proxy
name: nokku

networks:
  nokku:
    ipam:
      config:
        # Fixed subnet so NOKKU_TRUSTED_PROXIES can trust the proxy container
        # (caddy) regardless of the IP Docker assigns it.
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  nokku-data:
  caddy-data:
  caddy-config:

services:
  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nokku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nokku}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - nokku

  nokku:
    image: ${NOKKU_IMAGE:-ghcr.io/nokku-sh/nokku:latest}
    depends_on:
      postgres:
        condition: service_healthy
    # All NOKKU_*, OAuth, email and storage settings come from .env.
    env_file: .env
    # Schema migrations run automatically on boot (NOKKU_DB_AUTOMIGRATE=true).
    environment:
      # Point the app at the services in this stack.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-nokku}
      PGUSER: ${POSTGRES_USER:-nokku}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      PGSSLMODE: disable
      # Caddy runs on the same internal network, forwarded client headers are
      # only honored from peers in this range.
      NOKKU_TRUSTED_PROXIES: 172.28.0.0/16
      # Local object storage (default backend), persisted on a volume.
      NOKKU_STORAGE: local
      NOKKU_LOCAL_STORAGE_PATH: /data
    volumes:
      - nokku-data:/data
    # Only reachable through the caddy reverse proxy.
    # The app listens on 0.0.0.0:3000 by default (NOKKU_PORT in .env to change).
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - nokku

  caddy:
    image: docker.io/library/caddy:2-alpine
    depends_on:
      - nokku
    environment:
      SITE_ADDRESS: ${NOKKU_BASE_URL:?NOKKU_BASE_URL is required in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - nokku
