version: "3"

tasks:
  build:
    desc: Build binary
    cmds:
      - CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o nokkud ./cmd/nokkud
      - sudo mv nokkud /usr/local/bin

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  fuzz:
    desc: Fuzz every fuzz target for FUZZTIME (default 30s)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - |
        for pkg in $(go list ./...); do
          for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz'); do
            go test "$pkg" -run='^$' -fuzz="^${target}$" -fuzztime="{{.FUZZTIME}}"
          done
        done

  snapshot:
    desc: Build a snapshot of the daemon image, then scan it
    env:
      NOKKU_ONLY: daemon
      IMAGE: ghcr.io/nokku-sh/nokkud
    # .goreleaser.yaml is in the repo root.
    dir: ..
    cmds:
      - goreleaser release --snapshot --clean --skip=validate,sign,sbom,archive,nfpm,ko
      # dockers_v2 tags snapshot images per arch, e.g. 0.0.1-next-amd64
      - docker tag $IMAGE:$(jq -r .version dist/metadata.json)-{{ARCH}} $IMAGE:nightly
      - grype --only-fixed $IMAGE:nightly

  snapshot:bin:
    desc: Build snapshot binaries of the daemon only
    env:
      NOKKU_ONLY: daemon
    dir: ..
    cmds:
      - goreleaser build --snapshot --clean {{.CLI_ARGS}}
