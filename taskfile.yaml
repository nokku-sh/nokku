version: "3"

includes:
  core:
    taskfile: ./core
    dir: ./core
  daemon:
    taskfile: ./daemon
    dir: ./daemon
  cli:
    taskfile: ./cli
    dir: ./cli

tasks:
  gen:
    desc: Regenerate everything that comes from proto/ and the SQL queries
    cmds:
      - buf generate
      - cd core && sqlc generate

  update:
    desc: Update dependencies
    cmds:
      - cd proto && buf dep update
      - cd core/web && pnpm update --latest
      - go get -u ./...
      - go mod tidy

  test:
    desc: Run the unit tests of every app
    cmds:
      - go test -race -count=1 -cover ./...

  smoke:
    desc: Run the end-to-end smoke test, the real binaries against throwaway containers, needs Docker
    cmds:
      - cd core && go test -tags integration,smoke -count=1 -v -timeout 20m ./internal/integration/smoke/...

  lint:
    desc: Run go vet & lint on the whole repo
    cmds:
      - go mod tidy
      - cd proto && buf format -d --exit-code && buf lint
      - go fmt ./...
      # The tag keeps core/internal/integration compiling, its tests run in core:test:integration
      - go vet -tags integration ./...
      # Fails on a function that no binary and no test reaches.
      - |
        dead=$(go run golang.org/x/tools/cmd/deadcode@latest -test -tags integration ./...)
        test -z "$dead" || { echo "$dead"; exit 1; }
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  snapshot:
    desc: Build a snapshot of every binary, package and image
    cmds:
      # The core embeds the web app, a snapshot without it serves an empty UI.
      - go generate ./core/web
      - goreleaser --snapshot --clean --skip=validate,sign,sbom,archive
