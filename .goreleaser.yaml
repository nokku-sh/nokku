version: 2
project_name: nokku
report_sizes: true

builds:
  - binary: "{{ .ProjectName }}"
    main: ./cmd/nokku
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/mizuchilabs/kata/buildinfo.Version={{ .Version }}
      - -X github.com/mizuchilabs/kata/buildinfo.Commit={{ .Commit }}
      - -X github.com/mizuchilabs/kata/buildinfo.Date={{ .CommitDate }}
      - -X github.com/nokku-sh/nokku/internal/config.licensePublicKey={{ .Env.NOKKU_LICENSE_PUBLIC_KEY }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

kos:
  - repositories: [ghcr.io/nokku-sh/nokku]
    main: ./cmd/nokku
    bare: true
    preserve_import_paths: false
    sbom: spdx
    creation_time: "{{ .CommitTimestamp }}"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"

sboms:
  - cmd: syft
    documents:
      - "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.sbom.json"
    args:
      - "$artifact"
      - "--source-name={{ .ProjectName }}"
      - "--source-version={{ .Version }}"
      - "--select-catalogers=-file"
      - "--output"
      - "cyclonedx-json=$document"
    artifacts: binary

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: false
  replace_existing_draft: true
  replace_existing_artifacts: true
  mode: append
