version: 2
project_name: nokku
report_sizes: true

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - &build
    id: nokku
    main: ./core/cmd/nokku
    binary: nokku
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/mizuchilabs/kata/buildinfo.Version={{ .Version }}
      - -X github.com/mizuchilabs/kata/buildinfo.Commit={{ .Commit }}
      - -X github.com/mizuchilabs/kata/buildinfo.Date={{ .CommitDate }}
      - -X github.com/nokku-sh/nokku/core/internal/config.licensePublicKey={{ .Env.NOKKU_LICENSE_PUBLIC_KEY }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - &client
    <<: *build
    id: nokkud
    main: ./daemon/cmd/nokkud
    binary: nokkud
    ldflags:
      - -s -w
      - -X github.com/mizuchilabs/kata/buildinfo.Version={{ .Version }}
      - -X github.com/mizuchilabs/kata/buildinfo.Commit={{ .Commit }}
      - -X github.com/mizuchilabs/kata/buildinfo.Date={{ .CommitDate }}
    goarch:
      - amd64
      - arm64
      - riscv64

  - <<: *client
    id: nk
    main: ./cli/cmd/nk
    binary: nk
    goos:
      - linux
      - windows

  # The Secure Enclave bridge is Swift linked through cgo, so the darwin
  # binaries only build on a Mac.
  - <<: *client
    id: nk-darwin
    main: ./cli/cmd/nk
    binary: nk
    env: [CGO_ENABLED=1]
    tags: [enclave]
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      pre: ./cli/internal/enclave/build.sh
    skip: '{{ ne .Runtime.Goos "darwin" }}'

kos:
  - build: nokku
    repositories: [ghcr.io/nokku-sh/nokku]
    main: ./core/cmd/nokku
    bare: true
    preserve_import_paths: false
    sbom: spdx
    creation_time: "{{ .CommitTimestamp }}"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64

dockers_v2:
  - ids: [nokkud]
    images: [ghcr.io/nokku-sh/nokkud]
    dockerfile: daemon/Dockerfile
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: nokkud
      org.opencontainers.image.description: "The Nokku daemon, for containers you want to SSH into"
      org.opencontainers.image.source: "https://github.com/nokku-sh/nokku"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "Apache-2.0"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"

sboms:
  - cmd: syft
    documents:
      - "{{ .Binary }}_{{ .Os }}_{{ .Arch }}.sbom.json"
    args:
      - "$artifact"
      - "--source-name={{ .Binary }}"
      - "--source-version={{ .Version }}"
      - "--select-catalogers=-file"
      - "--output"
      - "cyclonedx-json=$document"
    artifacts: binary

archives:
  - id: binaries
    ids: [nokku, nk, nk-darwin]
    formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

  - id: nokkud
    ids: [nokkud]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: daemon/packaging/systemd/nokkud.service
        dst: nokkud.service
      - src: daemon/packaging/openrc/nokkud.openrc
        dst: nokkud.openrc # needs to be renamed for OpenRC
      - src: daemon/packaging/ufw/nokkud
        dst: nokkud.ufw
      - src: daemon/packaging/firewalld/nokkud.xml
        dst: nokkud.firewalld.xml
      - src: daemon/packaging/install.sh
        dst: install.sh
      - src: daemon/packaging/scripts/postinstall.sh
        dst: postinstall.sh

nfpms:
  - &package
    id: nk
    ids: [nk]
    package_name: nk
    vendor: "MizuchiLabs"
    homepage: "https://github.com/nokku-sh/nokku/tree/main/cli"
    description: "Nokku SSH companion"
    maintainer: "Nokku <support@mizuchi.dev>"
    license: Apache-2.0
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm

  - <<: *package
    id: nokkud
    ids: [nokkud]
    package_name: nokkud
    homepage: "https://github.com/nokku-sh/nokku/tree/main/daemon"
    description: "Nokku Daemon - SSH certificate management daemon"
    scripts:
      postinstall: daemon/packaging/scripts/postinstall.sh
      preremove: daemon/packaging/scripts/preremove.sh
      postremove: daemon/packaging/scripts/postremove.sh
    contents:
      - src: daemon/packaging/systemd/nokkud.service
        dst: /usr/share/nokkud/systemd/nokkud.service
      - src: daemon/packaging/openrc/nokkud.openrc
        dst: /usr/share/nokkud/openrc/nokkud.openrc
      - src: daemon/packaging/ufw/nokkud
        dst: /usr/share/nokkud/ufw/nokkud
      - src: daemon/packaging/firewalld/nokkud.xml
        dst: /usr/share/nokkud/firewalld/nokkud.xml

checksum:
  name_template: "checksums.txt"

source:
  enabled: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: false
  replace_existing_draft: true
  replace_existing_artifacts: true
  mode: append
