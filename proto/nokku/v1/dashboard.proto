edition = "2023";

package nokku.v1;

import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/daemon.proto";
import "nokku/v1/target.proto";
import "nokku/v1/target_account.proto";
import "nokku/v1/util.proto";

service DashboardService {
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message LiveSession {
  string id = 1;
  string daemon_id = 2;
  string daemon_name = 3;
  string username = 4;
  string user_id = 5;
  bool recording = 6;
  bool web = 7;
  google.protobuf.Timestamp started_at = 8;
}

// EndingGrant is a subject's grants on one account that end at the same time, usually given in one go.
message EndingGrant {
  message Target {
    string id = 1;
    string name = 2;
  }
  SubjectKind subject_kind = 1;
  string subject_id = 2;
  string subject_name = 3;
  string username = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated Target targets = 6; // the first 20 by name, target_count has them all
  int32 target_count = 7;
}

message GetDashboardRequest {}
message GetDashboardResponse {
  int32 targets = 1;
  int32 targets_online = 2;
  int32 targets_manual = 3;
  int32 daemons = 4;
  int32 daemons_online = 5;
  repeated Daemon pending_daemons = 6;
  repeated Target offline_servers = 7; // with their daemons, approved but not connected
  int32 users = 8;
  int64 recording_bytes = 9;
  int64 recording_quota_bytes = 10;
  repeated LiveSession live_sessions = 11;
  repeated int32 activity = 12;
  repeated int32 failures = 13;
  repeated EventLog recent_changes = 14;
  int32 daemons_behind = 15;
  repeated EndingGrant ending_grants = 16; // the next five to end within a day
  int32 ending_grants_total = 17;
}
