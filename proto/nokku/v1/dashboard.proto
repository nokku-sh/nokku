edition = "2023";

package nokku.v1;

import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/audit_log.proto";
import "nokku/v1/daemon.proto";
import "nokku/v1/subject.proto";
import "nokku/v1/target.proto";

service DashboardService {
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_VIEWER
      service_account: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message LiveSession {
  string id = 1;
  string daemon_id = 2;
  string daemon_name = 3;
  string username = 4;
  string user_id = 5;
  bool recording = 6;
  bool web = 7;
  google.protobuf.Timestamp started_at = 8;
}

// EndingGrant is a subject's grants on one account that end at the same time, usually given in one go.
message EndingGrant {
  message Target {
    string id = 1;
    string name = 2;
  }
  Subject subject = 1;
  string subject_name = 2;
  string username = 3;
  google.protobuf.Timestamp expires_at = 4;
  // The first 20 by name.
  repeated Target targets = 5;
  int32 target_count = 6;
}

message GetDashboardRequest {}
message GetDashboardResponse {
  int32 target_count = 1;
  int32 online_target_count = 2;
  int32 manual_target_count = 3;
  repeated Target offline_targets = 4;
  int32 daemon_count = 5;
  int32 online_daemon_count = 6;
  int32 behind_daemon_count = 7;
  repeated Daemon pending_daemons = 8;
  int32 user_count = 9;
  int64 recording_bytes = 10;
  int64 recording_quota_bytes = 11;
  repeated LiveSession live_sessions = 12;
  // The last 24 hours, oldest first.
  repeated int32 events_by_hour = 13;
  repeated int32 failures_by_hour = 14;
  repeated AuditEvent recent_changes = 15;
  // The next five to end within a day.
  repeated EndingGrant ending_grants = 16;
  int32 ending_grant_count = 17;
}
