edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

service SSOService {
  rpc ListSSOProviders(ListSSOProvidersRequest) returns (ListSSOProvidersResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc PutSSOProvider(PutSSOProviderRequest) returns (PutSSOProviderResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
  rpc DeleteSSOProvider(DeleteSSOProviderRequest) returns (DeleteSSOProviderResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
  // GetSSOTest returns a test sign-in, only to the owner who ran it.
  rpc GetSSOTest(GetSSOTestRequest) returns (GetSSOTestResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message SSOProvider {
  string provider_id = 1;
  string name = 2;
  bool enabled = 3;
  string issuer_url = 4;
  string client_id = 5;
  repeated string scopes = 6;
  bool jit_provisioning = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListSSOProvidersRequest {}
message ListSSOProvidersResponse {
  repeated SSOProvider providers = 1;
  // What the owner registers with every provider.
  string redirect_uri = 2;
}

message PutSSOProviderRequest {
  string provider_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9-]+$"
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  bool enabled = 3;
  string issuer_url = 4 [(buf.validate.field).string.uri = true];
  string client_id = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
  // Empty keeps the stored secret.
  string client_secret = 6 [(buf.validate.field).string.max_len = 1000];
  repeated string scopes = 7;
  bool jit_provisioning = 8;
}
message PutSSOProviderResponse {
  SSOProvider provider = 1;
}

message DeleteSSOProviderRequest {
  string provider_id = 1 [(buf.validate.field).string.min_len = 1];
}
message DeleteSSOProviderResponse {}

// The step of a test sign-in that failed.
enum SSOTestStep {
  SSO_TEST_STEP_UNSPECIFIED = 0;
  // Fetching the issuer's discovery document.
  SSO_TEST_STEP_DISCOVERY = 1;
  // The provider's answer to the sign-in, before any token.
  SSO_TEST_STEP_AUTHORIZE = 2;
  // Trading the code for tokens, where the client secret is checked.
  SSO_TEST_STEP_TOKEN = 3;
  // Checking the ID token's signature, audience and nonce.
  SSO_TEST_STEP_ID_TOKEN = 4;
}

// What a real sign-in with the same identity would do.
enum SSOTestOutcome {
  SSO_TEST_OUTCOME_UNSPECIFIED = 0;
  // The identity belongs to a member, or a member has the email.
  SSO_TEST_OUTCOME_SIGNS_IN = 1;
  // Nobody has the email, and the provider creates accounts.
  SSO_TEST_OUTCOME_CREATES = 2;
  // Nobody has the email, and the provider does not create accounts.
  SSO_TEST_OUTCOME_NO_ACCOUNT = 3;
  // The provider would create an account, but every seat is taken.
  SSO_TEST_OUTCOME_NO_SEAT = 4;
  SSO_TEST_OUTCOME_NO_EMAIL = 5;
  SSO_TEST_OUTCOME_EMAIL_UNVERIFIED = 6;
  // The email is the owner's, who has to link the identity from their profile.
  SSO_TEST_OUTCOME_OWNER_LINK = 7;
  // The member is deactivated.
  SSO_TEST_OUTCOME_INACTIVE = 8;
}

message SSOTest {
  string provider_id = 1;
  // Unset when every step passed.
  SSOTestStep failed_step = 2;
  // Why the step failed, in the provider's or the check's words.
  string error = 3;
  string subject = 4;
  string email = 5;
  string name = 6;
  bool email_verified = 7;
  // The claim names in the ID token.
  repeated string claims = 8;
  SSOTestOutcome outcome = 9;
  // The member a real sign-in lands on.
  string member_email = 10;
  google.protobuf.Timestamp tested_at = 11;
}

message GetSSOTestRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message GetSSOTestResponse {
  SSOTest test = 1;
}
