edition = "2023";

package nokku.v1;

import "google/protobuf/descriptor.proto";

// Access is the rule of one call. A call without it is denied.
message Access {
  bool public = 1;
  bool daemon = 2;
  WorkspaceRole role = 3;
  // A browser session must be from the last 10 minutes.
  bool fresh = 4;
  // Lets an nk session call, a browser session needs no such field.
  bool cli = 5;
  bool service_account = 6;
  // The plan feature the call needs.
  string feature = 7;
  // A create that counts against the plan's resource cap.
  bool capped = 8;
  // The handler writes its own audit events.
  bool unaudited = 9;
}

enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  WORKSPACE_ROLE_MEMBER = 1;
  WORKSPACE_ROLE_VIEWER = 2;
  WORKSPACE_ROLE_EDITOR = 3;
  WORKSPACE_ROLE_ADMIN = 4;
  WORKSPACE_ROLE_OWNER = 5;
}

extend google.protobuf.MethodOptions {
  Access access = 51000;
}
