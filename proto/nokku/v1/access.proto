edition = "2023";

package nokku.v1;

import "google/protobuf/descriptor.proto";

message Access {
  bool public = 1;
  bool self = 2;
  WorkspaceRole role = 3;
  bool daemon = 4;
  // people_only refuses service accounts, so a leaked token cannot mint more credentials for itself.
  bool people_only = 5;
}

enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  WORKSPACE_ROLE_MEMBER = 1;
  WORKSPACE_ROLE_VIEWER = 2;
  WORKSPACE_ROLE_EDITOR = 3;
  WORKSPACE_ROLE_ADMIN = 4;
  WORKSPACE_ROLE_OWNER = 5;
}

extend google.protobuf.MethodOptions {
  Access access = 51000;
}
