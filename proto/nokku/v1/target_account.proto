edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/subject.proto";

service TargetAccountService {
  rpc ListTargetAccounts(ListTargetAccountsRequest) returns (ListTargetAccountsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_VIEWER
      service_account: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc AddTargetAccount(AddTargetAccountRequest) returns (AddTargetAccountResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc RemoveTargetAccount(RemoveTargetAccountRequest) returns (RemoveTargetAccountResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc GetGrantScope(GetGrantScopeRequest) returns (GetGrantScopeResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_VIEWER
      service_account: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Grant(GrantRequest) returns (GrantResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
}

message TargetAccount {
  string id = 1;
  string target_id = 2;
  string username = 3;
  repeated Grant grants = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp first_seen_at = 6;
}

message Grant {
  Subject subject = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListTargetAccountsRequest {
  string target_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
  string query = 4 [(buf.validate.field).string.max_len = 256];
}
message ListTargetAccountsResponse {
  repeated TargetAccount accounts = 1;
  int32 total = 2;
}

message GetGrantScopeRequest {
  repeated string target_ids = 1 [(buf.validate.field).repeated = {
    max_items: 500
    items: {
      string: {uuid: true}
    }
  }];
  repeated string tags = 2 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}
message GetGrantScopeResponse {
  int32 target_count = 1;
  // The first five by name.
  repeated string target_names = 2;
  repeated GrantAccount accounts = 3;
}

message GrantAccount {
  string username = 1;
  int32 target_count = 2;
}

message GrantSpec {
  repeated Subject subjects = 1 [(buf.validate.field).repeated.max_items = 50];
  repeated string target_ids = 2 [(buf.validate.field).repeated = {
    max_items: 500
    items: {
      string: {uuid: true}
    }
  }];
  repeated string tags = 3 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  string username = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  google.protobuf.Timestamp expires_at = 5 [(buf.validate.field).timestamp = {
    gt_now: true
    within: {seconds: 31622400}
  }];
  bool overwrite_expiry = 6;
}

message GrantOutcome {
  string subject_id = 1;
  int32 added_count = 2;
  int32 unchanged_count = 3;
  int32 other_expiry_count = 4;
}

message GrantPlan {
  int32 target_count = 1;
  // Targets that have the account. The others are skipped.
  int32 matched_target_count = 2;
  repeated string skipped_target_names = 3;
  repeated GrantOutcome outcomes = 4;
}

message GrantRequest {
  GrantSpec grant = 1 [(buf.validate.field).required = true];
  bool dry_run = 2;
}
message GrantResponse {
  GrantPlan plan = 1;
}

message RevokeSpec {
  Subject subject = 1 [(buf.validate.field).required = true];
  repeated string target_ids = 2 [(buf.validate.field).repeated = {
    max_items: 500
    items: {
      string: {uuid: true}
    }
  }];
  repeated string tags = 3 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  // Empty is every account.
  string username = 4 [(buf.validate.field).string.max_len = 32];
  bool all_targets = 5;
}

message RevokeAccount {
  string username = 1;
  int32 target_count = 2;
  repeated string target_names = 3;
}

message RevokePlan {
  int32 grant_count = 1;
  int32 target_count = 2;
  repeated RevokeAccount accounts = 3;
  int32 multi_tag_target_count = 4;
  repeated string multi_tag_target_names = 5;
}

message RevokeRequest {
  RevokeSpec revoke = 1 [(buf.validate.field).required = true];
  bool dry_run = 2;
}
message RevokeResponse {
  RevokePlan plan = 1;
}

message AddTargetAccountRequest {
  string target_id = 1 [(buf.validate.field).string.uuid = true];
  string username = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[A-Za-z_][A-Za-z0-9._-]*\\$?$"
  }];
}
message AddTargetAccountResponse {
  TargetAccount account = 1;
}

message RemoveTargetAccountRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message RemoveTargetAccountResponse {}
