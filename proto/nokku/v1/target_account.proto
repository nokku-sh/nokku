edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

service TargetAccountService {
  rpc ListTargetAccounts(ListTargetAccountsRequest) returns (ListTargetAccountsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc AddTargetAccount(AddTargetAccountRequest) returns (AddTargetAccountResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc RemoveTargetAccount(RemoveTargetAccountRequest) returns (RemoveTargetAccountResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc AddSubjects(AddSubjectsRequest) returns (AddSubjectsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc RemoveSubjects(RemoveSubjectsRequest) returns (RemoveSubjectsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc RevokeAllAccess(RevokeAllAccessRequest) returns (RevokeAllAccessResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  // PlanGrant says what Grant would do with the same request, and changes nothing.
  rpc PlanGrant(PlanGrantRequest) returns (PlanGrantResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Grant gives subjects one account on many servers, the servers by id or by tag. It is one transaction and one
  // access change, however many servers.
  rpc Grant(GrantRequest) returns (GrantResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  // PlanRevoke says what Revoke would do with the same request, and changes nothing.
  rpc PlanRevoke(PlanRevokeRequest) returns (PlanRevokeResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Revoke takes one subject's own grants off many servers, the servers by id or by tag. Like Grant it is one
  // transaction and one access change.
  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
}

enum SubjectKind {
  SUBJECT_KIND_UNSPECIFIED = 0;
  SUBJECT_KIND_USER = 1;
  SUBJECT_KIND_TEAM = 2;
  SUBJECT_KIND_SERVICE_ACCOUNT = 3;
}

message TargetAccount {
  string id = 1;
  string target_id = 2;
  string username = 3;
  repeated string user_ids = 4;
  repeated string team_ids = 5;
  repeated string service_account_ids = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp seen_at = 8;
  map<string, google.protobuf.Timestamp> expires_at = 9;
}

message ListTargetAccountsRequest {
  string target_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
  string query = 4;
}
message ListTargetAccountsResponse {
  repeated TargetAccount accounts = 1;
  int32 total = 2;
}

message AddSubjectsRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string subject_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
    items: {
      string: {uuid: true}
    }
  }];
  SubjectKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp expires_at = 4 [(buf.validate.field).timestamp = {
    gt_now: true
    within: {seconds: 31622400}
  }];
}
message AddSubjectsResponse {}

message RemoveSubjectsRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string subject_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
    items: {
      string: {uuid: true}
    }
  }];
  SubjectKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message RemoveSubjectsResponse {}

message GrantSubject {
  string id = 1 [(buf.validate.field).string.uuid = true];
  SubjectKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Who gets which account where. A server counts when its id is named or it has one of the tags.
message GrantSpec {
  repeated GrantSubject subjects = 1 [(buf.validate.field).repeated.max_items = 50];
  repeated string target_ids = 2 [(buf.validate.field).repeated = {
    max_items: 500
    items: {
      string: {uuid: true}
    }
  }];
  repeated string tags = 3 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  // Empty asks only which servers these are and what accounts they have.
  string username = 4 [(buf.validate.field).string.max_len = 32];
  // Unset is for good.
  google.protobuf.Timestamp expires_at = 5;
  // A grant that stands with another end keeps it, unless this is set.
  bool change_ends = 6;
}

message GrantAccount {
  string username = 1;
  int32 servers = 2;
}

message GrantOutcome {
  string subject_id = 1;
  // New grants.
  int32 added = 2;
  // Grants that stand already with the same end.
  int32 same = 3;
  // Grants that stand with another end.
  int32 other_end = 4;
}

message GrantPlan {
  // Servers the ids and tags name.
  int32 servers = 1;
  // Some of their names, to show which they are.
  repeated string server_names = 2;
  // The accounts those servers have, the most common first.
  repeated GrantAccount accounts = 3;
  // Servers that have the account asked for.
  int32 with_account = 4;
  // Some of the servers that lack it. Nothing happens there.
  repeated string skipped = 5;
  repeated GrantOutcome outcomes = 6;
}

message PlanGrantRequest {
  GrantSpec grant = 1 [(buf.validate.field).required = true];
}
message PlanGrantResponse {
  GrantPlan plan = 1;
}

message GrantRequest {
  GrantSpec grant = 1 [(buf.validate.field).required = true];
}
message GrantResponse {
  // What it did.
  GrantPlan plan = 1;
}

// Whose grants go where. A server counts when its id is named or it has one of the tags. Only the subject's own
// grants go, what a team gives its members stays.
message RevokeSpec {
  GrantSubject subject = 1 [(buf.validate.field).required = true];
  repeated string target_ids = 2 [(buf.validate.field).repeated = {
    max_items: 500
    items: {
      string: {uuid: true}
    }
  }];
  repeated string tags = 3 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

message RevokeAccount {
  string username = 1;
  // Servers the grant on this account goes from.
  int32 servers = 2;
  // Some of their names.
  repeated string server_names = 3;
}

message RevokePlan {
  // Grants that go, one per account and server.
  int32 grants = 1;
  // Servers they are on.
  int32 servers = 2;
  // The accounts, the one on the most servers first.
  repeated RevokeAccount accounts = 3;
  // Servers among them with more than one tag. The access goes for those tags too.
  int32 other_tags = 4;
  // Some of their names.
  repeated string other_tag_names = 5;
}

message PlanRevokeRequest {
  RevokeSpec revoke = 1 [(buf.validate.field).required = true];
}
message PlanRevokeResponse {
  RevokePlan plan = 1;
}

message RevokeRequest {
  RevokeSpec revoke = 1 [(buf.validate.field).required = true];
}
message RevokeResponse {
  // What it did.
  RevokePlan plan = 1;
}

message RevokeAllAccessRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
  SubjectKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message RevokeAllAccessResponse {}

message AddTargetAccountRequest {
  string target_id = 1 [(buf.validate.field).string.uuid = true];
  string username = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[A-Za-z_][A-Za-z0-9._-]*\\$?$"
  }];
}
message AddTargetAccountResponse {
  TargetAccount account = 1;
}

message RemoveTargetAccountRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message RemoveTargetAccountResponse {}
