edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

service RecordingService {
  rpc GetRecording(GetRecordingRequest) returns (stream GetRecordingResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListRecordings(ListRecordingsRequest) returns (ListRecordingsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A person deletes evidence, never a CI job, and only right after a sign-in.
  rpc DeleteRecording(DeleteRecordingRequest) returns (DeleteRecordingResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
      fresh: true
    };
  }
}

message Recording {
  string id = 1;
  string daemon_id = 2;
  string username = 3;
  int64 size_bytes = 4;
  bool complete = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  string daemon_name = 8;
  string subject_id = 9;
  string principal = 10;
  string subject_name = 11;
  // live is a session still running as far as the core can tell, ended_at unset behind a connected daemon.
  bool live = 12;
}

message UploadRecordingRequest {
  oneof msg {
    RecordingMeta meta = 1;
    bytes chunk = 2;
    RecordingFinal final = 3;
  }
}

message RecordingMeta {
  string recording_id = 1 [(buf.validate.field).string.uuid = true];
  string username = 2 [(buf.validate.field).string.max_len = 32];
  string principal = 3 [(buf.validate.field).string.max_len = 160];
  google.protobuf.Timestamp started_at = 4;
}

message RecordingFinal {
  int64 size_bytes = 1 [(buf.validate.field).int64.gte = 0];
  string cut_reason = 2 [(buf.validate.field).string.max_len = 200];
  // ended_at is when the session ended, which a late upload can be long after.
  google.protobuf.Timestamp ended_at = 3;
}

message UploadRecordingResponse {
  string recording_id = 1;
  // size_bytes is what the core holds of the recording.
  int64 size_bytes = 2;
  // complete says the core takes no more of this recording. Only this answer
  // lets a daemon delete its file, an error never does.
  bool complete = 3;
}

message ListRecordingsRequest {
  string daemon_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
  string username = 4;
  string subject_id = 5 [(buf.validate.field).string.uuid = true];
}
message ListRecordingsResponse {
  repeated Recording recordings = 1;
  int32 total = 2;
  int64 total_bytes = 3;
}

message GetRecordingRequest {
  string recording_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetRecordingResponse {
  oneof msg {
    RecordingMeta meta = 1;
    bytes chunk = 2;
  }
}

message DeleteRecordingRequest {
  string recording_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteRecordingResponse {}
