edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

service JoinTokenService {
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_ADMIN
      fresh: true
    };
  }
  rpc ListJoinTokens(ListJoinTokensRequest) returns (ListJoinTokensResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DeleteJoinToken(DeleteJoinTokenRequest) returns (DeleteJoinTokenResponse) {
    option (access) = {role: WORKSPACE_ROLE_ADMIN};
  }
}

message JoinToken {
  string id = 1;
  string label = 2;
  google.protobuf.Timestamp expires_at = 3;
  int32 max_uses = 4;
  int32 uses = 5;
  bool auto_approve = 6;
  string ca_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_used_at = 9;
  repeated string tags = 10;
  repeated JoinTokenGrant grants = 11;
  bool ephemeral = 12;
  google.protobuf.Duration retire_after = 13;
}

message JoinTokenGrant {
  string username = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[A-Za-z_][A-Za-z0-9._-]*\\$?$"
  }];
  repeated string user_ids = 2 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {uuid: true}
    }
  }];
  repeated string team_ids = 3 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {uuid: true}
    }
  }];
  repeated string service_account_ids = 4 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {uuid: true}
    }
  }];
}

message CreateJoinTokenRequest {
  string label = 1 [(buf.validate.field).string.max_len = 100];
  google.protobuf.Duration ttl = 2 [(buf.validate.field).duration.gt = {seconds: 0}];
  int32 max_uses = 3 [(buf.validate.field).int32.gt = 0];
  bool auto_approve = 4;
  string ca_id = 5 [(buf.validate.field).string.uuid = true];
  repeated string tags = 6 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {max_len: 64}
    }
  }];
  repeated JoinTokenGrant grants = 7 [(buf.validate.field).repeated.max_items = 32];
  bool ephemeral = 8;
  google.protobuf.Duration retire_after = 9 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 604800}
  }];
}
message CreateJoinTokenResponse {
  JoinToken token = 1;
  string secret = 2;
}

message ListJoinTokensRequest {}
message ListJoinTokensResponse {
  repeated JoinToken tokens = 1;
}

message DeleteJoinTokenRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteJoinTokenResponse {}
