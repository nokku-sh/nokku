edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/daemon.proto";

service WorkspaceService {
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_MEMBER
      service_account: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_OWNER
      service_account: true
    };
  }
  rpc SetEnforceSSO(SetEnforceSSORequest) returns (SetEnforceSSOResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_OWNER
      fresh: true
    };
  }
  rpc UpdateDaemonDefaults(UpdateDaemonDefaultsRequest) returns (UpdateDaemonDefaultsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_ADMIN
      service_account: true
    };
  }
  rpc SetDefaultSafeguards(SetDefaultSafeguardsRequest) returns (SetDefaultSafeguardsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_ADMIN
      fresh: true
    };
  }
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_OWNER
      fresh: true
    };
  }
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (access) = {public: true};
  }
  rpc FindWorkspaces(FindWorkspacesRequest) returns (FindWorkspacesResponse) {
    option (access) = {public: true};
  }
}

message Workspace {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  WorkspaceSettings settings = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated string requestable_tags = 8;
}

message WorkspaceSettings {
  nokku.v1.DaemonConfig default_daemon_config = 1;
  bool enforce_sso = 2;
  google.protobuf.Duration session_idle_timeout = 3 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 86400}
  }];
}

message GetWorkspaceRequest {}
message GetWorkspaceResponse {
  Workspace workspace = 1;
  string base_url = 2;
  bool inactive = 3;
  google.protobuf.Timestamp delete_at = 4;
  map<string, bool> features = 5;
  repeated PlanFeature catalog = 6;
  map<string, string> plan_names = 7;
}

message PlanFeature {
  string key = 1;
  string label = 2;
  string plan = 3;
}

message UpdateWorkspaceRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string description = 2 [(buf.validate.field).string.max_len = 1000];
  google.protobuf.FieldMask update_mask = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "name",
        "description"
      ]
    }
  ];
}

message SetEnforceSSORequest {
  bool enforce_sso = 1 [(buf.validate.field).required = true];
}
message SetEnforceSSOResponse {
  Workspace workspace = 1;
}
message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

message UpdateDaemonDefaultsRequest {
  nokku.v1.DaemonConfig default_daemon_config = 1;
  google.protobuf.Duration session_idle_timeout = 2 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 86400}
  }];
  google.protobuf.FieldMask update_mask = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "default_daemon_config.allow_forwarding",
        "default_daemon_config.allow_agent_forwarding",
        "default_daemon_config.gateway_ports",
        "session_idle_timeout"
      ]
    }
  ];
}
message UpdateDaemonDefaultsResponse {
  Workspace workspace = 1;
}

message SetDefaultSafeguardsRequest {
  bool record_sessions = 1;
  bool kill_on_revoke = 2;
}
message SetDefaultSafeguardsResponse {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {}
message DeleteWorkspaceResponse {}

message FindWorkspacesRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}
message FindWorkspacesResponse {}

message CreateWorkspaceRequest {
  string slug = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string owner_email = 3 [(buf.validate.field).string.email = true];
  string owner_name = 4 [(buf.validate.field).string.max_len = 256];
}
message CreateWorkspaceResponse {
  string url = 1;
}
