edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/account.proto";
import "nokku/v1/daemon.proto";

// The workspace is the tenant. Users live inside it, so this service also
// manages them. A self-hosted server has exactly one workspace.
service WorkspaceService {
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option (access) = {self: true};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
  // Refused on a self-hosted server.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Never touches the owner, see TransferOwnership.
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse) {
    option (access) = {role: WORKSPACE_ROLE_ADMIN};
  }
  // A deactivated user keeps their grants and history but cannot sign in or
  // get certificates.
  rpc SetUserActive(SetUserActiveRequest) returns (SetUserActiveResponse) {
    option (access) = {role: WORKSPACE_ROLE_ADMIN};
  }
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (access) = {role: WORKSPACE_ROLE_ADMIN};
  }
  // The caller becomes an admin.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
  // Public signup on the hosted service's root host. Creates the workspace
  // and its owner and mails the owner a sign-in link. Refused elsewhere.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (access) = {public: true};
  }
  // Tells a client that keeps a view open when to read again. A message
  // carries no data, only which services answer differently now. The server
  // ends the stream after a while, the client opens it again.
  rpc SubscribeChanges(SubscribeChangesRequest) returns (stream SubscribeChangesResponse) {
    option (access) = {self: true};
  }
}

message Workspace {
  string id = 1;
  // The subdomain on the hosted service.
  string slug = 2;
  string name = 3;
  string description = 4;
  WorkspaceSettings settings = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message WorkspaceSettings {
  nokku.v1.DaemonConfig default_daemon_config = 1;
  // Only the workspace's OIDC providers may sign users in.
  bool enforce_sso = 4;
}

message GetWorkspaceRequest {}
message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message UpdateWorkspaceRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string description = 2 [(buf.validate.field).string.max_len = 1000];
  WorkspaceSettings settings = 3;
}
message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {}
message DeleteWorkspaceResponse {}

message CreateWorkspaceRequest {
  string slug = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string owner_email = 3 [(buf.validate.field).string.email = true];
  string owner_name = 4 [(buf.validate.field).string.max_len = 256];
}
message CreateWorkspaceResponse {
  // Where the new workspace lives.
  string url = 1;
}

message SubscribeChangesRequest {}
// With neither field set nothing changed. The server sends one of those to
// open the stream and whenever it has been silent for a while.
message SubscribeChangesResponse {
  // Full names of the services to ask again, like nokku.v1.TargetService.
  repeated string services = 1;
  // Anything may have changed.
  bool everything = 2;
}

// Users ----------------------------------------------------------------------
message ListUsersRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
  string query = 3;
  WorkspaceRole role = 4 [(buf.validate.field).enum.defined_only = true];
}
message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message GetUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetUserResponse {
  User user = 1;
}

message UpdateUserRoleRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  WorkspaceRole role = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2,
      3,
      4
    ]
  }];
}
message UpdateUserRoleResponse {}

message SetUserActiveRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  bool active = 2;
}
message SetUserActiveResponse {}

message DeleteUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteUserResponse {}

message TransferOwnershipRequest {
  string new_owner_id = 1 [(buf.validate.field).string.uuid = true];
}
message TransferOwnershipResponse {}
