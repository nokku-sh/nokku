edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/account.proto";
import "nokku/v1/daemon.proto";

service WorkspaceService {
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option (access) = {self: true};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse) {
    option (access) = {role: WORKSPACE_ROLE_ADMIN};
  }
  rpc SetUserActive(SetUserActiveRequest) returns (SetUserActiveResponse) {
    option (access) = {role: WORKSPACE_ROLE_ADMIN};
  }
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (access) = {role: WORKSPACE_ROLE_ADMIN};
  }
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (access) = {public: true};
  }
}

message Workspace {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  WorkspaceSettings settings = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // requestable_tags names the targets members may ask access for. Set with SetRequestableTags.
  repeated string requestable_tags = 8;
}

message WorkspaceSettings {
  nokku.v1.DaemonConfig default_daemon_config = 1;
  bool enforce_sso = 2;
  // session_idle_timeout closes interactive sessions on every daemon after that long without input. Zero is off.
  google.protobuf.Duration session_idle_timeout = 3 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 86400}
  }];
}

message GetWorkspaceRequest {}
message GetWorkspaceResponse {
  Workspace workspace = 1;
  // base_url is where this workspace lives, the slug host on the hosted service. Callback and SCIM URLs start with it.
  string base_url = 2;
  // inactive is a hosted workspace with no trial or plan. It signs no user certificates until the owner subscribes.
  bool inactive = 3;
  // delete_at is when an inactive workspace is deleted, unless the owner subscribes before.
  google.protobuf.Timestamp delete_at = 4;
  // features is what every member may see, so any page can show a lock. GetBilling has the rest.
  map<string, bool> features = 5;
  // catalog names every feature and the smallest plan that has it. It is the same for every workspace.
  repeated PlanFeature catalog = 6;
  // plan_names are the names people see, by plan code.
  map<string, string> plan_names = 7;
}

message PlanFeature {
  string key = 1;
  string label = 2;
  // plan is the code of the smallest plan that has the feature, every larger one has it too.
  string plan = 3;
}

message UpdateWorkspaceRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string description = 2 [(buf.validate.field).string.max_len = 1000];
  WorkspaceSettings settings = 3;
}
message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {}
message DeleteWorkspaceResponse {}

message CreateWorkspaceRequest {
  string slug = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  string name = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 256
  }];
  string owner_email = 3 [(buf.validate.field).string.email = true];
  string owner_name = 4 [(buf.validate.field).string.max_len = 256];
}
message CreateWorkspaceResponse {
  string url = 1;
}

// Users ----------------------------------------------------------------------
message ListUsersRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
  string query = 3;
  WorkspaceRole role = 4 [(buf.validate.field).enum.defined_only = true];
}
message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message GetUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetUserResponse {
  User user = 1;
}

message UpdateUserRoleRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  WorkspaceRole role = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2,
      3,
      4
    ]
  }];
}
message UpdateUserRoleResponse {}

message SetUserActiveRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  bool active = 2;
}
message SetUserActiveResponse {}

message DeleteUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteUserResponse {}

message TransferOwnershipRequest {
  string new_owner_id = 1 [(buf.validate.field).string.uuid = true];
}
message TransferOwnershipResponse {}
