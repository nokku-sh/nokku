edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

service BillingService {
  rpc GetBilling(GetBillingRequest) returns (GetBillingResponse) {
    option (access) = {role: WORKSPACE_ROLE_ADMIN};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreatePortal(CreatePortalRequest) returns (CreatePortalResponse) {
    option (access) = {self: true};
  }
  rpc CreateCheckout(CreateCheckoutRequest) returns (CreateCheckoutResponse) {
    option (access) = {self: true};
  }
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse) {
    option (access) = {self: true};
  }
  rpc GetLicense(GetLicenseRequest) returns (GetLicenseResponse) {
    option (access) = {self: true};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Self-hosted only. Takes effect at once, no restart.
  rpc ActivateLicense(ActivateLicenseRequest) returns (ActivateLicenseResponse) {
    option (access) = {role: WORKSPACE_ROLE_OWNER};
  }
}

message GetBillingRequest {}
message GetBillingResponse {
  string plan = 1;
  string mode = 2;
  map<string, bool> features = 3;
  Quotas quotas = 4;
  int64 user_count = 5;
  int64 resource_count = 6;
  Subscription subscription = 7;
}

message Quotas {
  int64 seats = 1;
  int64 retention_days = 2;
  int64 recording_storage_bytes = 3;
  int64 resource_cap = 4;
}

message Subscription {
  string status = 1;
  bool cancel_at_period_end = 2;
  google.protobuf.Timestamp current_period_end = 3;
}

message CreatePortalRequest {}
message CreatePortalResponse {
  string url = 1;
}

message CreateCheckoutRequest {}
message CreateCheckoutResponse {
  string url = 1;
}

message CancelSubscriptionRequest {
  bool immediate = 1;
  string reason = 2 [(buf.validate.field).string.max_len = 1000];
}
message CancelSubscriptionResponse {}

message GetLicenseRequest {}
message GetLicenseResponse {
  string plan = 1;
  bool active = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// The license covers the whole instance.
message ActivateLicenseRequest {
  string key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}
message ActivateLicenseResponse {}
