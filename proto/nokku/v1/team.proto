edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/account.proto";

service TeamService {
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_VIEWER
      cli: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
      capped: true
    };
  }
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc AddTeamMember(AddTeamMemberRequest) returns (AddTeamMemberResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc ListTeamMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTeamsForUser(ListTeamsForUserRequest) returns (ListTeamsForUserResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message Team {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  int32 member_count = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // The identity provider sets the members over SCIM.
  bool scim_managed = 8;
  // An admin lets a SCIM group of the same name take this team over, with the access it has. Until then such a group
  // is refused. The takeover uses it up.
  bool scim_open = 9;
}

message GetTeamRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetTeamResponse {
  Team team = 1;
}

message CreateTeamRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string description = 2 [(buf.validate.field).string.max_len = 1000];
  repeated string tags = 3;
}
message CreateTeamResponse {
  Team team = 1;
}

message UpdateTeamRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string description = 3 [(buf.validate.field).string.max_len = 1000];
  repeated string tags = 4;
  // Opening a team for SCIM takes a fresh sign-in, it hands its access to whoever runs the identity provider.
  bool scim_open = 6;
  google.protobuf.FieldMask update_mask = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "name",
        "description",
        "tags",
        "scim_open"
      ]
    }
  ];
}
message UpdateTeamResponse {
  Team team = 1;
}

message DeleteTeamRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteTeamResponse {}

message ListTeamsRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
  string query = 3;
  repeated string tags = 4;
}
message ListTeamsResponse {
  repeated Team teams = 1;
  int32 total = 2;
}

message AddTeamMemberRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}
message AddTeamMemberResponse {}

message RemoveTeamMemberRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}
message RemoveTeamMemberResponse {}

message ListTeamMembersRequest {
  string team_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListTeamMembersResponse {
  repeated User members = 1;
}

message ListTeamsForUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListTeamsForUserResponse {
  repeated Team teams = 1;
}
