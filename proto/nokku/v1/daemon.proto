edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/recordings.proto";

service DaemonService {
  rpc GetDaemon(GetDaemonRequest) returns (GetDaemonResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateDaemon(UpdateDaemonRequest) returns (UpdateDaemonResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc DeleteDaemon(DeleteDaemonRequest) returns (DeleteDaemonResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc ListDaemons(ListDaemonsRequest) returns (ListDaemonsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (access) = {role: WORKSPACE_ROLE_MEMBER};
  }
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc Relay(stream RelayRequest) returns (stream RelayResponse) {
    option (access) = {role: WORKSPACE_ROLE_MEMBER};
  }
}

service DaemonControlService {
  rpc EnrollDaemon(EnrollDaemonRequest) returns (EnrollDaemonResponse) {
    option (access) = {public: true};
  }
  rpc SyncDaemon(SyncDaemonRequest) returns (SyncDaemonResponse) {
    option (access) = {daemon: true};
  }
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse) {
    option (access) = {daemon: true};
  }
  rpc DaemonRelay(stream DaemonRelayRequest) returns (stream DaemonRelayResponse) {
    option (access) = {daemon: true};
  }
  rpc SignHostCertificate(SignHostCertificateRequest) returns (SignHostCertificateResponse) {
    option (access) = {daemon: true};
  }
  rpc UploadRecording(stream UploadRecordingRequest) returns (UploadRecordingResponse) {
    option (access) = {daemon: true};
  }
  rpc UnenrollDaemon(UnenrollDaemonRequest) returns (UnenrollDaemonResponse) {
    option (access) = {daemon: true};
  }
}

enum DaemonStatus {
  DAEMON_STATUS_UNSPECIFIED = 0;
  DAEMON_STATUS_PENDING = 1;
  DAEMON_STATUS_ACCEPTED = 2;
  DAEMON_STATUS_REJECTED = 3;
}

message Daemon {
  string id = 1;
  string name = 2;
  bool online = 3;
  DaemonStatus status = 4;
  DaemonConfig config = 5;
  map<string, string> metadata = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_seen_at = 9;
}

message DaemonConfig {
  bool record_sessions = 1;
  bool allow_forwarding = 2;
  bool allow_agent_forwarding = 3;
  bool gateway_ports = 4;
  bool ephemeral = 5;
  // idle_timeout closes an interactive session nobody typed into for that long. It is the workspace's
  // session_idle_timeout, filled in by the core on sync and ignored when sent.
  google.protobuf.Duration idle_timeout = 6;
}

message GetDaemonRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetDaemonResponse {
  Daemon daemon = 1;
}

message UpdateDaemonRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  DaemonStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0] /* Prevent UNSPECIFIED */
  }];
  DaemonConfig config = 3;
}

message UpdateDaemonResponse {}

message DeleteDaemonRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteDaemonResponse {}

message ListDaemonsRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
  string query = 3;
  bool online = 4;
  DaemonStatus status = 5;
}
message ListDaemonsResponse {
  repeated Daemon daemons = 1;
  int32 total = 2;
}

message CreateSessionRequest {
  string daemon_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string username = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[A-Za-z_][A-Za-z0-9._-]*\\$?$"
  }];
}
message CreateSessionResponse {
  DaemonSession session = 1;
  string daemon_name = 2;
}

message ListSessionsRequest {
  string daemon_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message ListSessionsResponse {
  repeated DaemonSession sessions = 1;
  string daemon_name = 2;
}

message CloseSessionRequest {
  string daemon_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string session_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message CloseSessionResponse {}

message EnrollDaemonRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
  map<string, string> metadata = 2 [(buf.validate.field).map = {
    max_pairs: 16
    keys: {
      string: {max_len: 64}
    }
    values: {
      string: {max_len: 256}
    }
  }];
}
message EnrollDaemonResponse {
  string id = 1;
  string target_id = 2;
  DaemonStatus status = 3;
  DaemonConfig config = 4;
  string access_token = 5;
}

message AccountPrincipals {
  string username = 1;
  repeated string cert_principals = 2;
}

message SyncDaemonRequest {
  repeated string users = 1 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {max_len: 256}
    }
  }];
  // Where the daemon's sshd listens, as ip:port.
  repeated string private_ips = 2 [(buf.validate.field).repeated = {
    max_items: 8
    items: {
      string: {max_len: 64}
    }
  }];
  map<string, string> metadata = 3 [(buf.validate.field).map = {
    max_pairs: 16
    keys: {
      string: {max_len: 64}
    }
    values: {
      string: {max_len: 256}
    }
  }];
}

message SyncDaemonResponse {
  DaemonStatus status = 1;
  DaemonConfig config = 2;
  repeated AccountPrincipals principals = 3;
  int64 state_version = 4;
  // The user CA key logins are checked against.
  string ca_public_key = 5;
  repeated RetiredCAKey retired_ca_keys = 6;
  // The host CA key the daemon's host certificate has to come from.
  string host_ca_public_key = 7;
}

message RetiredCAKey {
  string public_key = 1;
  google.protobuf.Timestamp trusted_until = 2;
}

message SignHostCertificateRequest {
  string public_key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10000
  }];
}
message SignHostCertificateResponse {
  string signed_certificate = 1;
}

message UnenrollDaemonRequest {}
message UnenrollDaemonResponse {}

// Control Stream -------------------------------------------------------------

message ConnectRequest {
  oneof msg {
    Heartbeat heartbeat = 1;
  }
}

message ConnectResponse {
  oneof msg {
    StateUpdate state_update = 1;
    RelayOpen relay_open = 2;
  }
}

message Heartbeat {
  int64 state_version = 1;
}

message StateUpdate {}

message DaemonSession {
  string session_id = 1;
  string username = 2;
  string user_id = 3;
}

// Relay Stream --------------------------------------------------------------

message RelayOpen {
  string relay_id = 1;
  // The user's address as the core saw it. The daemon's sshd reports it as
  // the remote address of the relayed connection.
  string client_addr = 2;
}

message RelayStart {
  string daemon_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message RelayRequest {
  oneof msg {
    RelayStart start = 1;
    bytes data = 2;
  }
}

message RelayReady {
  string relay_id = 1;
}

message RelayResponse {
  oneof msg {
    RelayReady ready = 1;
    bytes data = 2;
    RelayClosed closed = 3;
  }
}

message RelayClosed {}

message DaemonRelayRequest {
  oneof msg {
    DaemonRelayReady ready = 1;
    bytes data = 2;
    DaemonRelayClosed closed = 3;
  }
}

message DaemonRelayResponse {
  oneof msg {
    bytes data = 1;
    DaemonRelayClosed closed = 2;
  }
}

message DaemonRelayReady {
  string relay_id = 1;
}

message DaemonRelayClosed {}
