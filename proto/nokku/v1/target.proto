edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/account.proto";
import "nokku/v1/certificates.proto";
import "nokku/v1/daemon.proto";
import "nokku/v1/join_token.proto";
import "nokku/v1/service_account.proto";
import "nokku/v1/target_account.proto";

service TargetService {
  rpc GetTarget(GetTargetRequest) returns (GetTargetResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateTarget(CreateTargetRequest) returns (CreateTargetResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      capped: true
    };
  }
  rpc UpdateTarget(UpdateTargetRequest) returns (UpdateTargetResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc DeleteTarget(DeleteTargetRequest) returns (DeleteTargetResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc GetSubjectAccess(GetSubjectAccessRequest) returns (GetSubjectAccessResponse) {
    option (access) = {self: true};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetTargetFilters(GetTargetFiltersRequest) returns (GetTargetFiltersResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SyncTargetUsers(SyncTargetUsersRequest) returns (SyncTargetUsersResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc GetAccessGraph(GetAccessGraphRequest) returns (GetAccessGraphResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListAccessGraphTargets(ListAccessGraphTargetsRequest) returns (ListAccessGraphTargetsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message SyncTargetUsersRequest {
  string target_id = 1 [(buf.validate.field).string.uuid = true];
  string host_public_key = 2;
  repeated string usernames = 3 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {max_len: 256}
    }
  }];
  repeated string endpoints = 4 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {max_len: 255}
    }
  }];
}

message SyncTargetUsersResponse {}

message Target {
  reserved 2;

  string id = 1;
  string daemon_id = 3;
  string name = 4;
  string description = 5;
  string host_public_key = 6; // pinned SSH host public key (manual mode)
  repeated string tags = 7;
  repeated string endpoints = 8;
  repeated string usernames = 9;
  repeated TargetAccount accounts = 10;
  map<string, string> metadata = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp last_sync_at = 14;
  // username_expires_at holds the usernames the subject asked about may only use until then. The others are for good.
  map<string, google.protobuf.Timestamp> username_expires_at = 15;
  // blocked says why the subject's grants here let nobody in today. Unset when they work.
  AccessBlock blocked = 16;
}

// AccessBlock is why grants that stand let nobody in today.
enum AccessBlock {
  ACCESS_BLOCK_UNSPECIFIED = 0;
  // The person is deactivated.
  ACCESS_BLOCK_USER_INACTIVE = 1;
  // The daemon of the server is pending or rejected.
  ACCESS_BLOCK_DAEMON_NOT_APPROVED = 2;
}

message GetTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetTargetResponse {
  Target target = 1;
}

message CreateTargetRequest {
  reserved 1;

  string name = 2 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }]; // can be empty
  string description = 3 [(buf.validate.field).string.max_len = 1000];
  string host_public_key = 4;
  repeated string endpoints = 5;
  repeated string tags = 6;
  repeated JoinTokenGrant grants = 7 [(buf.validate.field).repeated.max_items = 32];
}
message CreateTargetResponse {
  Target target = 1;
}

message UpdateTargetRequest {
  reserved 2;

  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }];
  string description = 4 [(buf.validate.field).string.max_len = 1000];
  string host_public_key = 5;
  repeated string endpoints = 6;
  repeated string tags = 7;
  // update_mask names the fields to change, the rest stay as they are. A named list may be empty, which clears it.
  google.protobuf.FieldMask update_mask = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "name",
        "description",
        "host_public_key",
        "endpoints",
        "tags"
      ]
    }
  ];
}
message UpdateTargetResponse {
  Target target = 1;
}

message DeleteTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteTargetResponse {}

message ListTargetsRequest {
  reserved 5;

  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
  string query = 3;
  string daemon_id = 4;
  repeated string accounts = 6;
  repeated string tags = 7;
}
message ListTargetsResponse {
  repeated Target targets = 1;
  int32 total = 2;
}

message GetSubjectAccessRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetSubjectAccessResponse {
  repeated Target targets = 1;
  repeated Daemon daemons = 2;
  // certificate_authority is the workspace's, for a subject with targets to log in to.
  CertificateAuthority certificate_authority = 3;
  oneof subject {
    User user = 4;
    ServiceAccount service_account = 5;
  }
}

message GetTargetFiltersRequest {}
message GetTargetFiltersResponse {
  repeated string tags = 1;
  repeated string accounts = 2;
}

message AccessGraphFilter {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
  string target_id = 2 [(buf.validate.field).string.uuid = true];
  string username = 3 [(buf.validate.field).string.max_len = 32];
  string tag = 4 [(buf.validate.field).string.max_len = 256];
}

message GetAccessGraphRequest {
  AccessGraphFilter filter = 1;
}

message GetAccessGraphResponse {
  repeated AccessGraphSubject subjects = 1;
  repeated AccessGraphAccount accounts = 2;
  repeated AccessGraphTag tags = 3;
  repeated AccessGraphGrant grants = 4;
  repeated AccessGraphReach reach = 5;
  int32 targets = 6;
}

message AccessGraphSubject {
  string id = 1;
  SubjectKind kind = 2;
  string name = 3;
  string email = 4; // users only
  int32 member_count = 5; // teams only
  int32 targets = 6;
}

message AccessGraphAccount {
  string username = 1;
  int32 targets = 2;
}

message AccessGraphTag {
  string tag = 1; // empty is the untagged bucket
  int32 targets = 2;
  int32 total = 3; // all targets with the tag, granted or not
}

// AccessGraphGrant is the edge from a subject to a login account.
message AccessGraphGrant {
  string subject_id = 1;
  string username = 2;
  int32 targets = 3;
}

// AccessGraphReach is the edge from a login account to a tag.
message AccessGraphReach {
  string username = 1;
  string tag = 2;
  int32 targets = 3;
}

message ListAccessGraphTargetsRequest {
  AccessGraphFilter filter = 1;
  string tag = 2 [(buf.validate.field).string.max_len = 256];
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
}

message ListAccessGraphTargetsResponse {
  repeated AccessGraphTarget targets = 1;
  int32 total = 2;
}

message AccessGraphTarget {
  string id = 1;
  string name = 2;
  bool matched = 3;
}
