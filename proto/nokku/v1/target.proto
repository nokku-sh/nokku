edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/account.proto";
import "nokku/v1/certificates.proto";
import "nokku/v1/daemon.proto";
import "nokku/v1/join_token.proto";
import "nokku/v1/service_account.proto";
import "nokku/v1/target_account.proto";

service TargetService {
  rpc GetTarget(GetTargetRequest) returns (GetTargetResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_VIEWER
      cli: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateTarget(CreateTargetRequest) returns (CreateTargetResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      capped: true
      cli: true
    };
  }
  rpc UpdateTarget(UpdateTargetRequest) returns (UpdateTargetResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc DeleteTarget(DeleteTargetRequest) returns (DeleteTargetResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      cli: true
    };
  }
  rpc GetSubjectAccess(GetSubjectAccessRequest) returns (GetSubjectAccessResponse) {
    option (access) = {
      self: true
      cli: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetTargetFilters(GetTargetFiltersRequest) returns (GetTargetFiltersResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SyncTargetUsers(SyncTargetUsersRequest) returns (SyncTargetUsersResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      cli: true
    };
  }
  rpc GetAccessGraph(GetAccessGraphRequest) returns (GetAccessGraphResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListAccessGraphTargets(ListAccessGraphTargetsRequest) returns (ListAccessGraphTargetsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetAccessMatrix is who reaches which tag, a page of rows at a time and only the cells that hold access.
  rpc GetAccessMatrix(GetAccessMatrixRequest) returns (GetAccessMatrixResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message SyncTargetUsersRequest {
  string target_id = 1 [(buf.validate.field).string.uuid = true];
  string host_public_key = 2;
  repeated string usernames = 3 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {max_len: 256}
    }
  }];
  repeated string endpoints = 4 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {max_len: 255}
    }
  }];
  // The CA key nk sync wrote. A report for a key a rollover replaced fails.
  string user_ca_public_key = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
}

message SyncTargetUsersResponse {}

message Target {
  string id = 1;
  string daemon_id = 2;
  string name = 3;
  string description = 4;
  string host_public_key = 5; // pinned SSH host public key (manual mode)
  repeated string tags = 6;
  repeated string endpoints = 7;
  repeated string usernames = 8;
  repeated TargetAccount accounts = 9;
  map<string, string> metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp last_sync_at = 13;
  // username_expires_at holds the usernames the subject asked about may only use until then. The others are for good.
  map<string, google.protobuf.Timestamp> username_expires_at = 14;
  // blocked says why the subject's grants here let nobody in today. Unset when they work.
  AccessBlock blocked = 15;
  // daemon is the server's daemon with its live state, from ListTargets and GetTarget. Unset for nk sync servers.
  Daemon daemon = 16;
}

// AccessBlock is why grants that stand let nobody in today.
enum AccessBlock {
  ACCESS_BLOCK_UNSPECIFIED = 0;
  // The person is deactivated.
  ACCESS_BLOCK_USER_INACTIVE = 1;
  // The daemon of the server is pending or rejected.
  ACCESS_BLOCK_DAEMON_NOT_APPROVED = 2;
}

message GetTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetTargetResponse {
  Target target = 1;
}

message CreateTargetRequest {
  string name = 1 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }]; // can be empty
  string description = 2 [(buf.validate.field).string.max_len = 1000];
  string host_public_key = 3;
  repeated string endpoints = 4;
  repeated string tags = 5;
  repeated JoinTokenGrant grants = 6 [(buf.validate.field).repeated.max_items = 32];
}
message CreateTargetResponse {
  Target target = 1;
}

message UpdateTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }];
  string description = 3 [(buf.validate.field).string.max_len = 1000];
  repeated string endpoints = 4;
  repeated string tags = 5;
  // update_mask names the fields to change, the rest stay as they are. A named list may be empty, which clears it.
  // The pinned host key is not among them, only nk sync on the server sets it.
  google.protobuf.FieldMask update_mask = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "name",
        "description",
        "endpoints",
        "tags"
      ]
    }
  ];
}
message UpdateTargetResponse {
  Target target = 1;
}

message DeleteTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteTargetResponse {}

message ListTargetsRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
  string query = 3;
  string daemon_id = 4;
  repeated string accounts = 5;
  repeated string tags = 6;
  TargetStatus status = 7 [(buf.validate.field).enum = {defined_only: true}];
  // ids keeps only these servers, like the ones a person picked.
  repeated string ids = 8 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
}

// TargetStatus is what a server's daemon is up to, or that it has none.
enum TargetStatus {
  TARGET_STATUS_UNSPECIFIED = 0;
  // Its daemon waits for approval or was rejected.
  TARGET_STATUS_PENDING = 1;
  TARGET_STATUS_ONLINE = 2;
  // Its daemon is approved but not connected.
  TARGET_STATUS_OFFLINE = 3;
  // Set up with nk sync, no daemon.
  TARGET_STATUS_MANUAL = 4;
}

message ListTargetsResponse {
  repeated Target targets = 1;
  int32 total = 2;
}

message GetSubjectAccessRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetSubjectAccessResponse {
  repeated Target targets = 1;
  repeated Daemon daemons = 2;
  // certificate_authority is the workspace's, for a subject with targets to log in to.
  CertificateAuthority certificate_authority = 3;
  oneof subject {
    User user = 4;
    ServiceAccount service_account = 5;
  }
}

message GetTargetFiltersRequest {}
message GetTargetFiltersResponse {
  repeated string tags = 1;
  repeated string accounts = 2;
}

message AccessGraphFilter {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
  string target_id = 2 [(buf.validate.field).string.uuid = true];
  string username = 3 [(buf.validate.field).string.max_len = 32];
  string tag = 4 [(buf.validate.field).string.max_len = 256];
}

message GetAccessGraphRequest {
  AccessGraphFilter filter = 1;
}

message GetAccessGraphResponse {
  repeated AccessGraphSubject subjects = 1;
  repeated AccessGraphAccount accounts = 2;
  repeated AccessGraphTag tags = 3;
  repeated AccessGraphGrant grants = 4;
  repeated AccessGraphReach reach = 5;
  int32 targets = 6;
}

message AccessGraphSubject {
  string id = 1;
  SubjectKind kind = 2;
  string name = 3;
  string email = 4; // users only
  int32 member_count = 5; // teams only
  int32 targets = 6;
}

message AccessGraphAccount {
  string username = 1;
  int32 targets = 2;
}

message AccessGraphTag {
  string tag = 1; // empty is the untagged bucket
  int32 targets = 2;
  int32 total = 3; // all targets with the tag, granted or not
}

// AccessGraphGrant is the edge from a subject to a login account.
message AccessGraphGrant {
  string subject_id = 1;
  string username = 2;
  int32 targets = 3;
}

// AccessGraphReach is the edge from a login account to a tag.
message AccessGraphReach {
  string username = 1;
  string tag = 2;
  int32 targets = 3;
}

message ListAccessGraphTargetsRequest {
  AccessGraphFilter filter = 1;
  string tag = 2 [(buf.validate.field).string.max_len = 256];
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
}

message ListAccessGraphTargetsResponse {
  repeated AccessGraphTarget targets = 1;
  int32 total = 2;
}

message AccessGraphTarget {
  string id = 1;
  string name = 2;
  bool matched = 3;
}

message GetAccessMatrixRequest {
  // query matches the name or email of a row.
  string query = 1 [(buf.validate.field).string.max_len = 256];
  // kind keeps only people, teams or service accounts.
  SubjectKind kind = 2 [(buf.validate.field).enum = {defined_only: true}];
  // tags are the columns, the biggest ones when empty. An empty tag is the servers with none.
  repeated string tags = 3 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {max_len: 256}
    }
  }];
  int32 limit = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 5 [(buf.validate.field).int32.gte = 0];
}

message GetAccessMatrixResponse {
  // columns are the tags the cells are for, in order.
  repeated AccessGraphTag columns = 1;
  repeated AccessMatrixRow rows = 2;
  // total counts every row that matches, not only this page.
  int32 total = 3;
  // tags is every tag with its servers, to pick other columns from.
  repeated AccessGraphTag tags = 4;
}

// AccessMatrixRow is a person, team or service account holding a grant. A team's members get in through its row.
message AccessMatrixRow {
  string subject_id = 1;
  SubjectKind kind = 2;
  string name = 3;
  string email = 4; // people only
  int32 member_count = 5; // teams only
  int32 targets = 6; // every server the row reaches, any tag
  repeated AccessMatrixCell cells = 7; // only the columns it reaches, in no order
}

message AccessMatrixCell {
  string tag = 1;
  int32 targets = 2; // servers with the tag it reaches
  repeated string usernames = 3;
  // expires_at is when the last of its grants here ends. Unset when one is for good.
  google.protobuf.Timestamp expires_at = 4;
  // last_used_at is the newest certificate for one of these servers, by the row or a member of its team.
  google.protobuf.Timestamp last_used_at = 5;
}
