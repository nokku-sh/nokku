edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/certificates.proto";
import "nokku/v1/daemon.proto";
import "nokku/v1/join_token.proto";
import "nokku/v1/service_account.proto";
import "nokku/v1/target_account.proto";
import "nokku/v1/user.proto";

service TargetService {
  rpc GetTarget(GetTargetRequest) returns (GetTargetResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_VIEWER
      service_account: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_VIEWER
      cli: true
      service_account: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateTarget(CreateTargetRequest) returns (CreateTargetResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      cli: true
      service_account: true
      capped: true
    };
  }
  rpc UpdateTarget(UpdateTargetRequest) returns (UpdateTargetResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc RenameTarget(RenameTargetRequest) returns (RenameTargetResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      fresh: true
    };
  }
  rpc SetTargetEndpoints(SetTargetEndpointsRequest) returns (SetTargetEndpointsResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      fresh: true
    };
  }
  rpc DeleteTarget(DeleteTargetRequest) returns (DeleteTargetResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      fresh: true
      cli: true
      service_account: true
    };
  }
  rpc GetSubjectAccess(GetSubjectAccessRequest) returns (GetSubjectAccessResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_MEMBER
      cli: true
      service_account: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetTargetFilters(GetTargetFiltersRequest) returns (GetTargetFiltersResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_VIEWER
      service_account: true
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SyncTargetUsers(SyncTargetUsersRequest) returns (SyncTargetUsersResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      cli: true
      service_account: true
    };
  }
  rpc ForgetHostKey(ForgetHostKeyRequest) returns (ForgetHostKeyResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      fresh: true
    };
  }
}

message SyncTargetUsersRequest {
  string target_id = 1 [(buf.validate.field).string.uuid = true];
  string host_public_key = 2;
  repeated string usernames = 3 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {max_len: 256}
    }
  }];
  string user_ca_public_key = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
}

message SyncTargetUsersResponse {}

message ForgetHostKeyRequest {
  string target_id = 1 [(buf.validate.field).string.uuid = true];
}
message ForgetHostKeyResponse {}

message Target {
  string id = 1;
  string name = 2;
  string description = 3;
  string host_public_key = 4;
  repeated string tags = 5;
  repeated string endpoints = 6;
  repeated TargetAccount accounts = 7;
  map<string, string> metadata = 8;
  // Unset on a server set up with nk sync.
  Daemon daemon = 9;
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp manual_sync_at = 13;
}

// TargetAccess is what one subject may log in as on a target.
message TargetAccess {
  message Login {
    string username = 1;
    google.protobuf.Timestamp expires_at = 2;
  }
  Target target = 1;
  repeated Login logins = 2;
  AccessBlock blocked = 3;
}

enum AccessBlock {
  ACCESS_BLOCK_UNSPECIFIED = 0;
  ACCESS_BLOCK_USER_INACTIVE = 1;
  ACCESS_BLOCK_DAEMON_NOT_APPROVED = 2;
}

message GetTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetTargetResponse {
  Target target = 1;
}

message CreateTargetRequest {
  string name = 1 [(buf.validate.field).string = {
    max_len: 256
    pattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }]; // can be empty
  string description = 2 [(buf.validate.field).string.max_len = 1000];
  string host_public_key = 3;
  repeated string endpoints = 4 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {max_len: 256}
    }
  }];
  repeated string tags = 5 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {max_len: 64}
    }
  }];
  repeated JoinTokenGrant grants = 6 [(buf.validate.field).repeated.max_items = 32];
}
message CreateTargetResponse {
  Target target = 1;
}

message UpdateTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string description = 2 [(buf.validate.field).string.max_len = 1000];
  repeated string tags = 3 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {max_len: 64}
    }
  }];
  google.protobuf.FieldMask update_mask = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "description",
        "tags"
      ]
    }
  ];
}

message RenameTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
    }
  ];
}
message RenameTargetResponse {}

message SetTargetEndpointsRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string endpoints = 2 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {max_len: 256}
    }
  }];
}
message SetTargetEndpointsResponse {}
message UpdateTargetResponse {}

message DeleteTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteTargetResponse {}

message ListTargetsRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
  string query = 3 [(buf.validate.field).string.max_len = 256];
  repeated string accounts = 4 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {max_len: 32}
    }
  }];
  repeated string tags = 5 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      string: {max_len: 64}
    }
  }];
  TargetStatus status = 6 [(buf.validate.field).enum = {defined_only: true}];
  repeated string ids = 7 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
  bool missed_rollover = 8;
}

enum TargetStatus {
  TARGET_STATUS_UNSPECIFIED = 0;
  TARGET_STATUS_PENDING = 1;
  TARGET_STATUS_ONLINE = 2;
  TARGET_STATUS_OFFLINE = 3;
  TARGET_STATUS_MANUAL = 4;
}

message ListTargetsResponse {
  repeated Target targets = 1;
  int32 total = 2;
}

message GetSubjectAccessRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetSubjectAccessResponse {
  repeated TargetAccess targets = 1;
  CertificateAuthority certificate_authority = 2;
  oneof subject {
    User user = 3;
    ServiceAccount service_account = 4;
  }
}

message GetTargetFiltersRequest {}
message GetTargetFiltersResponse {
  repeated string tags = 1;
  repeated string accounts = 2;
}
