edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

// A workspace has one CA, made with it. A server has no tie to it, so every call here is about that one.
service CertificateService {
  rpc GetCertificateAuthority(GetCertificateAuthorityRequest) returns (GetCertificateAuthorityResponse) {
    option (access) = {role: WORKSPACE_ROLE_MEMBER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateCertificateAuthority(UpdateCertificateAuthorityRequest) returns (UpdateCertificateAuthorityResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_ADMIN
      people_only: true
      fresh: true
    };
  }
  rpc RolloverCertificateAuthority(RolloverCertificateAuthorityRequest) returns (RolloverCertificateAuthorityResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_ADMIN
      people_only: true
      fresh: true
    };
  }
  rpc SignSSHCertificate(SignSSHCertificateRequest) returns (SignSSHCertificateResponse) {
    option (access) = {
      self: true
      signs: true
    };
  }
}

message CertificateAuthority {
  string id = 1;
  string public_key = 2;
  string host_public_key = 3;
  // Unset until the first rollover.
  google.protobuf.Timestamp rotated_at = 4;
  google.protobuf.Duration user_default_ttl = 5;
  google.protobuf.Duration user_max_ttl = 6;
  google.protobuf.Duration host_ttl = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // source_address lists where people log in from. A service account has a list of its own.
  string source_address = 10;
  // What ssh-keygen -lf prints for each key.
  string public_key_fingerprint = 11;
  string host_public_key_fingerprint = 12;
}

message GetCertificateAuthorityRequest {}
message GetCertificateAuthorityResponse {
  CertificateAuthority certificate_authority = 1;
}

message UpdateCertificateAuthorityRequest {
  google.protobuf.Duration user_default_ttl = 1 [(buf.validate.field).duration = {
    gte: {seconds: 60} /* Min 1 minute */
    lte: {seconds: 31536000} /* Max 1 year */
  }];
  google.protobuf.Duration user_max_ttl = 2 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 31536000}
  }];
  google.protobuf.Duration host_ttl = 3 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 31536000}
  }];
  string source_address = 4 [(buf.validate.field).string.max_len = 1024];
  google.protobuf.FieldMask update_mask = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "user_default_ttl",
        "user_max_ttl",
        "host_ttl",
        "source_address"
      ]
    }
  ];
}
message UpdateCertificateAuthorityResponse {
  CertificateAuthority certificate_authority = 1;
}

// New keys replace both, and nothing trusts the old ones any more.
message RolloverCertificateAuthorityRequest {}
message RolloverCertificateAuthorityResponse {
  CertificateAuthority certificate_authority = 1;
}

// Certificate messages -------------------------------------------------------

message SignSSHCertificateRequest {
  string public_key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10000
  }];
  google.protobuf.Duration ttl = 2 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 31536000}
  }];
  string target_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message SignSSHCertificateResponse {
  string signed_certificate = 1;
  google.protobuf.Timestamp expires_at = 2;
}
