edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

service ServiceAccountService {
  rpc GetServiceAccount(GetServiceAccountRequest) returns (GetServiceAccountResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
      capped: true
    };
  }
  rpc UpdateServiceAccount(UpdateServiceAccountRequest) returns (UpdateServiceAccountResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
    };
  }
  rpc DeleteServiceAccount(DeleteServiceAccountRequest) returns (DeleteServiceAccountResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc CreateServiceAccountToken(CreateServiceAccountTokenRequest) returns (CreateServiceAccountTokenResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
      fresh: true
    };
  }
  rpc ListServiceAccountTokens(ListServiceAccountTokensRequest) returns (ListServiceAccountTokensResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RevokeServiceAccountToken(RevokeServiceAccountTokenRequest) returns (RevokeServiceAccountTokenResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
  }
  rpc AddServiceAccountFederation(AddServiceAccountFederationRequest) returns (AddServiceAccountFederationResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
      fresh: true
    };
  }
  rpc ListServiceAccountFederations(ListServiceAccountFederationsRequest) returns (ListServiceAccountFederationsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RemoveServiceAccountFederation(RemoveServiceAccountFederationRequest) returns (RemoveServiceAccountFederationResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      people_only: true
      fresh: true
    };
  }
}

message ServiceAccount {
  string id = 1;
  string name = 2;
  string description = 3;
  WorkspaceRole role = 4;
  repeated string tags = 5;
  google.protobuf.Timestamp last_used_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // force_command replaces what a login asks to run. source_address lists the addresses a login may come from.
  // Both go on the account's certificates, and the CA's own settings don't.
  string force_command = 9;
  string source_address = 10;
}

message ServiceAccountToken {
  string id = 1;
  string label = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
  google.protobuf.Timestamp created_at = 5;
}

// A rule says which jobs of a CI platform may sign in as the account: the issuer of their token and the claims it must
// hold, each exactly.
message ServiceAccountFederation {
  string id = 1;
  string service_account_id = 2;
  string issuer = 3;
  map<string, string> claims = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetServiceAccountRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetServiceAccountResponse {
  ServiceAccount service_account = 1;
}

message CreateServiceAccountRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }];
  string description = 2 [(buf.validate.field).string.max_len = 1000];
  WorkspaceRole role = 3 [(buf.validate.field).enum = {
    in: [
      0,
      1,
      2,
      3
    ]
  }];
  repeated string tags = 4;
  string force_command = 5 [(buf.validate.field).string.max_len = 1024];
  string source_address = 6 [(buf.validate.field).string.max_len = 1024];
}
message CreateServiceAccountResponse {
  ServiceAccount service_account = 1;
}

message UpdateServiceAccountRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }];
  string description = 3 [(buf.validate.field).string.max_len = 1000];
  WorkspaceRole role = 4 [(buf.validate.field).enum = {
    in: [
      0,
      1,
      2,
      3
    ]
  }];
  repeated string tags = 5;
  google.protobuf.FieldMask update_mask = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask = {
      in: [
        "name",
        "description",
        "role",
        "tags",
        "force_command",
        "source_address"
      ]
    }
  ];
  string force_command = 7 [(buf.validate.field).string.max_len = 1024];
  string source_address = 8 [(buf.validate.field).string.max_len = 1024];
}
message UpdateServiceAccountResponse {
  ServiceAccount service_account = 1;
}

message DeleteServiceAccountRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteServiceAccountResponse {}

message ListServiceAccountsRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
  string query = 3;
  WorkspaceRole role = 4 [(buf.validate.field).enum.defined_only = true];
  repeated string tags = 5;
}
message ListServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
  int32 total = 2;
}

message CreateServiceAccountTokenRequest {
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
  string label = 2 [(buf.validate.field).string.max_len = 100];
  google.protobuf.Timestamp expires_at = 3;
}
message CreateServiceAccountTokenResponse {
  ServiceAccountToken token = 1;
  string secret = 2;
}

message ListServiceAccountTokensRequest {
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListServiceAccountTokensResponse {
  repeated ServiceAccountToken tokens = 1;
}

message RevokeServiceAccountTokenRequest {
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}
message RevokeServiceAccountTokenResponse {}

message AddServiceAccountFederationRequest {
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
  string issuer = 2 [(buf.validate.field).string.max_len = 512];
  map<string, string> claims = 3 [(buf.validate.field).map = {
    max_pairs: 16
    keys: {
      string: {max_len: 128}
    }
    values: {
      string: {max_len: 512}
    }
  }];
}
message AddServiceAccountFederationResponse {
  ServiceAccountFederation federation = 1;
}

message ListServiceAccountFederationsRequest {
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListServiceAccountFederationsResponse {
  repeated ServiceAccountFederation federations = 1;
}

message RemoveServiceAccountFederationRequest {
  string service_account_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}
message RemoveServiceAccountFederationResponse {}
