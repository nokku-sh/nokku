edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";
import "nokku/v1/account.proto";

service AuthService {
  rpc RequestMagicLink(RequestMagicLinkRequest) returns (RequestMagicLinkResponse) {
    option (access) = {public: true};
  }
  rpc ConsumeMagicLink(ConsumeMagicLinkRequest) returns (ConsumeMagicLinkResponse) {
    option (access) = {public: true};
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (access) = {public: true};
  }
  rpc GetLoginOptions(GetLoginOptionsRequest) returns (GetLoginOptionsResponse) {
    option (access) = {public: true};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse) {
    option (access) = {public: true};
  }
  rpc CancelEmailChange(CancelEmailChangeRequest) returns (CancelEmailChangeResponse) {
    option (access) = {public: true};
  }
  // ExchangeWorkloadToken trades the signed token of a CI job for a short session of a service account. The workspace
  // comes from the host. The call carries a DPoP proof and the session is bound to its key.
  rpc ExchangeWorkloadToken(ExchangeWorkloadTokenRequest) returns (ExchangeWorkloadTokenResponse) {
    option (access) = {public: true};
  }
}

message RequestMagicLinkRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}
message RequestMagicLinkResponse {}

message ConsumeMagicLinkRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message ConsumeMagicLinkResponse {
  User user = 1;
}

message LogoutRequest {}
message LogoutResponse {}

message GetLoginOptionsRequest {}
message GetLoginOptionsResponse {
  string workspace_name = 1;
  bool magic_link = 2;
  bool passkey = 3;
  bool email_configured = 4;
  repeated SSOProviderInfo providers = 5;
}

message SSOProviderInfo {
  string provider_id = 1;
  string name = 2;
}

message ConfirmEmailChangeRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message ConfirmEmailChangeResponse {}

message CancelEmailChangeRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message CancelEmailChangeResponse {}

message ExchangeWorkloadTokenRequest {
  // The name of the account, what a job can know without a call.
  string service_account = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }];
  string token = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16384
  }];
}
message ExchangeWorkloadTokenResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}
